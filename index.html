<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Onboarding BeeFood</title>
<style>
:root{--bg:#0b1220;--bg-card:#111827;--bg-hover:#1a2332;--border:#1f2a3d;--text:#e5e7eb;--text-muted:#94a3b8;--primary:#3b82f6;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--accent:#22d3ee;--purple:#a855f7;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:340px 1fr;grid-template-rows:52px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:#0f172a;border-bottom:1px solid var(--border)}
.topbar h1{font-size:.95rem;font-weight:700;white-space:nowrap;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.nav-tabs{display:flex;gap:2px;flex-wrap:wrap;flex:1;overflow-x:auto}
.nav-tab{background:transparent;border:none;color:var(--text-muted);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:.8rem;white-space:nowrap}
.nav-tab:hover{background:var(--bg-hover);color:var(--text)}
.nav-tab.active{background:var(--primary);color:#fff}
.btn{border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:.8rem;background:var(--primary);color:#fff}
.btn-sm{padding:4px 8px;font-size:.75rem}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-success{background:var(--success);color:#052e16}
.btn:hover{filter:brightness(1.08)}
.sidebar{border-right:1px solid var(--border);display:flex;flex-direction:column;background:#0c1424;overflow:hidden}
.sidebar-tools{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--border)}
.sidebar-tools input,.sidebar-tools select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.8rem}
.filters-row{display:flex;gap:4px;flex-wrap:wrap}
.list-count{font-size:.72rem;color:var(--text-muted);padding:4px 8px}
#listArea{flex:1;overflow-y:auto;padding:4px}
.list-item{padding:10px 12px;border-radius:10px;cursor:pointer;margin-bottom:8px;border:1px solid var(--border);border-left:4px solid var(--primary);background:var(--bg-card);transition:background .15s,border-color .15s}
.list-item:hover{background:var(--bg-hover);border-color:#334155}
.list-item.active{background:#1e293b;border-color:var(--primary);box-shadow:0 0 0 1px rgba(59,130,246,.35)}
.list-item-title{font-size:.88rem;font-weight:700;color:var(--text);line-height:1.25}
.list-item-obs{font-size:.75rem;color:var(--text-muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.list-item-meta{font-size:.72rem;color:var(--text-muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.list-item-meta .code{opacity:.85}
.list-prog{height:4px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:8px}
.list-prog > span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:99px;font-size:.68rem;font-weight:600;text-transform:lowercase}
.pill-media{background:#1e3a5f;color:#93c5fd}
.pill-alta,.pill-urgente{background:#7f1d1d;color:#fecaca}
.pill-baixa{background:#14532d;color:#bbf7d0}
.pill-status-em{background:#422006;color:#fde68a}
.pill-status-ok{background:#14532d;color:#bbf7d0}
.pill-status-nao{background:#1e293b;color:#94a3b8}
.sidebar{width:100%}
#listArea{padding:8px}
.main{display:flex;flex-direction:column;overflow:hidden;position:relative}
#emptyState{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-muted)}
#detailView{display:none;flex-direction:column;height:100%;overflow:hidden}
.main-header{display:flex;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:#0f172a}
.main-header h2{font-size:1.05rem}
.main-header-meta{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.main-header-actions{display:flex;gap:5px;flex-wrap:wrap}
.main-content{flex:1;overflow-y:auto;padding:12px 14px}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.info-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}
.info-card.wide{grid-column:1/-1}
.info-card-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase}
.info-card-value{font-size:.88rem;margin-top:2px;word-break:break-word}
.section-box{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.section-head{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;cursor:pointer;font-size:.85rem;font-weight:600;user-select:none}
.section-head:hover{background:var(--bg-hover)}
.section-head .chevron{transition:transform .15s;color:var(--text-muted);font-size:.7rem}
.section-head.open .chevron{transform:rotate(90deg)}
.section-body{display:none;padding:8px 12px 12px;border-top:1px solid var(--border)}
.section-body.open{display:block}
.check-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #1a2332}
.check-item.done .check-text{text-decoration:line-through;color:var(--text-muted)}
.check-text{font-size:.84rem;flex:1}
.check-note{font-size:.75rem;color:var(--text-muted);margin-top:2px}
.progress-wrap{height:6px;background:#1e293b;border-radius:99px;overflow:hidden;margin:6px 0 12px}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px}
.obs-wrap{position:relative}
.obs-editable{min-height:64px;padding:8px 40px 8px 8px;border:1px dashed var(--border);border-radius:8px;font-size:.85rem;white-space:pre-wrap;cursor:text}
.mic-bubble{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:#0f172a;color:var(--accent);cursor:pointer;z-index:5}
.mic-bubble.recording{background:#7f1d1d;color:#fecaca}
.mic-popover{position:absolute;right:8px;bottom:48px;width:min(300px,calc(100% - 16px));background:#0f172a;border:1px solid var(--border);border-radius:10px;padding:8px;z-index:6;font-size:.8rem}
.transcribe-result{max-height:90px;overflow:auto;white-space:pre-wrap;margin:4px 0}
.history-item{font-size:.8rem;padding:6px 0;border-bottom:1px solid #1a2332}
.history-item .time{font-size:.7rem;color:var(--text-muted)}
.badge{display:inline-block;padding:1px 6px;border-radius:99px;font-size:.7rem}
.badge-sla-late{background:#7f1d1d;color:#fecaca}
.badge-sla-warn{background:#78350f;color:#fde68a}
.badge-sla-ok{background:#14532d;color:#bbf7d0}
.tag-chip{display:inline-block;background:#1e293b;border:1px solid var(--border);border-radius:99px;padding:2px 8px;font-size:.72rem;margin:2px;cursor:pointer}
.tag-chip.active,.tag-chip:hover{border-color:var(--primary);color:var(--accent)}
.treino-group-title{font-size:.72rem;font-weight:700;color:var(--accent);margin:10px 0 4px;text-transform:uppercase}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:12px}
.modal-box{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:.72rem;color:var(--text-muted);margin-bottom:2px}
.form-group input,.form-group select,.form-group textarea{width:100%;background:#0f172a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px 8px;font-size:.85rem}
.form-group textarea{min-height:70px;resize:vertical}
#toast{position:fixed;bottom:18px;right:18px;background:#1e293b;color:#fff;padding:10px 14px;border-radius:8px;border:1px solid var(--border);z-index:9999;display:none;max-width:320px;font-size:.85rem}
.empty-msg{color:var(--text-muted);font-size:.85rem;padding:16px;text-align:center}
.backup-banner{background:#1e3a5f;border:1px solid #2563eb;color:#dbeafe;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:.82rem;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}

.list-item{
  padding:12px 14px;border-radius:12px;cursor:pointer;margin-bottom:10px;
  border:1px solid #1e293b;border-left:4px solid var(--primary);
  background:linear-gradient(180deg,#152033 0%,#111827 100%);
  box-shadow:0 2px 8px rgba(0,0,0,.25);transition:transform .12s,box-shadow .12s,border-color .12s
}
.list-item:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.35);border-color:#334155}
.list-item.active{border-color:var(--primary);box-shadow:0 0 0 1px rgba(59,130,246,.4),0 6px 16px rgba(0,0,0,.35);background:linear-gradient(180deg,#1a2a44 0%,#152033 100%)}
.list-item-title{font-size:.9rem;font-weight:700;letter-spacing:-.01em}
.list-item-obs{font-size:.76rem;color:#94a3b8;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.list-item-meta{font-size:.7rem;color:#64748b;margin-top:8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.list-prog{height:5px;background:#0f172a;border-radius:99px;overflow:hidden;margin-top:10px}
.list-prog>span{display:block;height:100%;background:linear-gradient(90deg,#3b82f6,#22d3ee);border-radius:99px;box-shadow:0 0 8px rgba(34,211,238,.35)}
.pill{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;font-size:.68rem;font-weight:600}
.pill-media{background:#1e3a5f;color:#93c5fd}
.pill-alta,.pill-urgente{background:#7f1d1d;color:#fecaca}
.pill-baixa{background:#14532d;color:#bbf7d0}
.pill-status-em{background:#422006;color:#fde68a}
.pill-status-ok{background:#14532d;color:#bbf7d0}
.pill-status-nao{background:#1e293b;color:#94a3b8}

/* Gamification */
.xp-hero{
  background:linear-gradient(135deg,#1e1b4b 0%,#0f172a 50%,#042f2e 100%);
  border:1px solid #312e81;border-radius:14px;padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden
}
.xp-hero::before{
  content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;
  background:radial-gradient(circle,rgba(168,85,247,.25),transparent 70%);pointer-events:none
}
.xp-level{font-size:1.4rem;font-weight:800;background:linear-gradient(90deg,#c4b5fd,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.xp-sub{font-size:.8rem;color:#94a3b8;margin-top:2px}
.xp-bar-wrap{height:10px;background:#0f172a;border-radius:99px;overflow:hidden;margin:12px 0 6px;border:1px solid #1e293b}
.xp-bar{height:100%;border-radius:99px;background:linear-gradient(90deg,#a855f7,#3b82f6,#22d3ee);box-shadow:0 0 12px rgba(168,85,247,.45);transition:width .4s}
.xp-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.xp-stat{background:rgba(15,23,42,.7);border:1px solid #1e293b;border-radius:10px;padding:8px;text-align:center}
.xp-stat-n{font-size:1.1rem;font-weight:700;color:#e2e8f0}
.xp-stat-l{font-size:.65rem;color:#64748b;text-transform:uppercase;margin-top:2px}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:10px 0}
.badge-card{
  background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px 8px;text-align:center;
  transition:transform .12s,border-color .12s
}
.badge-card.on{border-color:#a855f7;background:linear-gradient(180deg,#1e1b4b,#0f172a);box-shadow:0 0 12px rgba(168,85,247,.2)}
.badge-card.off{opacity:.4;filter:grayscale(.6)}
.badge-card:hover{transform:translateY(-2px)}
.badge-icon{font-size:1.6rem;line-height:1}
.badge-name{font-size:.72rem;font-weight:600;margin-top:6px}
.badge-desc{font-size:.65rem;color:#64748b;margin-top:2px}
.mission-card{
  background:linear-gradient(90deg,#0c1a2e,#111827);border-left:4px solid #3b82f6;
  border-radius:10px;padding:12px 14px;margin:10px 0
}


/* Light theme */
body.theme-light{--bg:#f1f5f9;--bg-card:#ffffff;--bg-hover:#e2e8f0;--border:#cbd5e1;--text:#0f172a;--text-muted:#64748b}
body.theme-light .topbar,body.theme-light .sidebar,body.theme-light .main-header{background:#fff}
body.theme-light .list-item{background:linear-gradient(180deg,#fff,#f8fafc);box-shadow:0 1px 4px rgba(0,0,0,.08)}
body.theme-light .xp-hero{background:linear-gradient(135deg,#ede9fe,#ecfeff);border-color:#c4b5fd}
body.theme-light .nav-tab.active{background:var(--primary);color:#fff}
body.theme-light .obs-editable,body.theme-light .form-group input,body.theme-light .form-group select,body.theme-light .form-group textarea,
body.theme-light .sidebar-tools input,body.theme-light .sidebar-tools select{background:#fff;color:#0f172a;border-color:#cbd5e1}

/* Focus mode */
body.focus-mode .nav-tabs{display:none}
body.focus-mode .topbar h1::after{content:' · Foco';font-size:.75rem;opacity:.7}
body.focus-mode #app{grid-template-columns:320px 1fr}

/* Fiscal icons */
.fiscal-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.fiscal-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;font-size:.78rem;border:1px solid var(--border);background:#0f172a}
body.theme-light .fiscal-chip{background:#f8fafc}
.fiscal-chip.ok{border-color:#22c55e;color:#86efac}
.fiscal-chip.miss{border-color:#475569;color:#94a3b8}

/* Week ranking */
.week-rank{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:8px 0 12px}
.week-rank .xp-stat-n{font-size:1.2rem}

/* Confetti flash */
@keyframes confetti-pop{0%{transform:scale(.8);opacity:0}40%{transform:scale(1.05);opacity:1}100%{transform:scale(1);opacity:1}}
.xp-hero.pop{animation:confetti-pop .45s ease}

</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <h1>🐝 Onboarding</h1>
    <div class="nav-tabs">
      <button class="nav-tab active" data-tab="dashboard" onclick="switchTab('dashboard')">Hoje</button>
      <button class="nav-tab" data-tab="clientes" onclick="switchTab('clientes')">Clientes</button>
      <button class="nav-tab" data-tab="agenda" onclick="switchTab('agenda')">Agenda</button>
      <button class="nav-tab" data-tab="treino" onclick="switchTab('treino')">Treino</button>
      <button class="nav-tab" data-tab="scripts" onclick="switchTab('scripts')">Scripts</button>
      <button class="nav-tab" data-tab="impostos" onclick="switchTab('impostos')">Impostos</button>
      <button class="nav-tab" data-tab="casos" onclick="switchTab('casos')">Wiki</button>
      <button class="nav-tab" data-tab="carreira" onclick="switchTab('carreira')">Carreira</button>
      <button class="nav-tab" data-tab="config" onclick="switchTab('config')">Config</button>
    </div>
    <button class="btn btn-sm" id="btnNewMain" onclick="onNewMain()">+ Novo</button>
    <button class="btn btn-sm btn-outline" id="btnAnalysts" onclick="openAnalystManager()" style="display:none">Analistas</button>
  </div>
  <aside class="sidebar">
    <div class="sidebar-tools">
      <input id="searchInput" placeholder="Buscar..." oninput="onSearchInput()" />
      <div class="filters-row" id="filtersClientes">
        <select id="statusFilter" onchange="renderSidebar()">
          <option value="acompanhando">Acompanhando</option>
          <option value="all">Todos ativos</option>
          <option value="nao_iniciado">Não iniciado</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluido">Concluído</option>
          <option value="meu_dia">Só meu dia</option>
          <option value="sla_atrasado">SLA atrasado</option>
          <option value="arquivados">Arquivados</option>
        </select>
        <select id="prioFilter" onchange="renderSidebar()">
          <option value="all">Prioridade</option>
          <option value="urgente">Urgente</option>
          <option value="alta">Alta</option>
          <option value="media">Média</option>
          <option value="baixa">Baixa</option>
        </select>
      </div>
    </div>
    <div class="list-count" id="listCount">—</div>
    <div id="listArea"></div>
  </aside>
  <main class="main">
    <div id="emptyState">Selecione um item ou use as abas acima</div>
    <div id="detailView"></div>
  </main>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>

const STORAGE_KEY='beefood_onboarding_v4';
const ANALYSTS_KEY='beefood_analysts_v1';
const FB_CONFIG={
  apiKey:'AIzaSyBTkIyrqsHpIWuQYo6Caf_WAo41Ay24v4I',
  authDomain:'beefood-onboarding.firebaseapp.com',
  projectId:'beefood-onboarding',
  storageBucket:'beefood-onboarding.firebasestorage.app',
  messagingSenderId:'101623415864',
  appId:'1:101623415864:web:152c30bfe49ab08b6912cd'
};
const FB_COLLECTIONS=['clients','agenda','scripts','casos','trainings','manualSessions','bitrixTemplates'];
let fbReady=false, fbApplying=false, fbMetaDirty=false, fbEntering=false, fbSecondary=null, fbBootstrapInProgress=false;
let fbDirty={}, fbRemote={}, fbInitialDone={}, fbAuditLogs=[], fbUnsubs=[];
let fbAnalystsReady=false, fbMetaReady=false, fbFirstSyncDone=false;
try{
  if(window.firebase){
    if(!firebase.apps.length) firebase.initializeApp(FB_CONFIG);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  }
}catch(e){ console.warn('Firebase init', e); }

function analystEmail(nome){
  const slug=String(nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/^[.]+|[.]+$/g,'');
  return (slug||'analista')+'@beefood-onboarding.firebaseapp.com';
}
function getSecondaryAuth(){
  if(!window.firebase) return null;
  if(!fbSecondary){
    fbSecondary = firebase.apps.find(a=>a.name==='Secondary') || firebase.initializeApp(FB_CONFIG, 'Secondary');
  }
  return fbSecondary.auth();
}
function fbSanitize(obj){
  try{ return JSON.parse(JSON.stringify(obj)); }catch(e){ return obj; }
}
function recKey(obj){
  if(obj==null || typeof obj!=='object') return JSON.stringify(obj);
  if(Array.isArray(obj)) return '['+obj.map(recKey).join(',')+']';
  return '{'+Object.keys(obj).sort().map(k=>JSON.stringify(k)+':'+recKey(obj[k])).join(',')+'}';
}
function persistLocalOnly(){
  const prev=fbApplying;
  fbApplying=true;
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  try{ if(typeof savePersonalData==='function') savePersonalData(); }catch(e){}
  fbApplying=prev;
}
function teamRef(){
  return firebase.firestore().collection('team').doc('main');
}

// Analistas iniciais
let analysts = [
  { id: 'pedro', nome: 'Pedro', senhaLocal: '', isAdmin: true, createdAt: new Date().toISOString() }
];

try {
  const rawA = localStorage.getItem(ANALYSTS_KEY);
  if (rawA) analysts = JSON.parse(rawA);
} catch(e){}

function saveAnalysts(){
  try { localStorage.setItem(ANALYSTS_KEY, JSON.stringify(analysts)); } catch(e){}
}

let currentAnalyst = null;

function simpleHash(str){
  // hash simples para uso interno (não é seguro para produção externa)
  let h = 0;
  for(let i=0;i<str.length;i++) h = ((h<<5)-h) + str.charCodeAt(i) | 0;
  return 'h'+Math.abs(h);
}

function showLogin(){
  document.getElementById('app').style.display = 'none';
  let overlay = document.getElementById('loginOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'loginOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:#0b1220;display:flex;align-items:center;justify-content:center;z-index:9999;color:#e5e7eb';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML = `
    <div style="background:#111827;border:1px solid #1f2a3d;border-radius:12px;padding:28px;width:320px;max-width:90%">
      <h2 style="margin:0 0 16px;font-size:1.1rem;background:linear-gradient(90deg,#22d3ee,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">BeeFood Onboarding</h2>
      <div class="form-group" style="margin-bottom:10px">

function authErrorMessage(err){
  const code=err && err.code || '';
  if(code==='auth/wrong-password' || code==='auth/invalid-credential' || code==='auth/invalid-login-credentials') return 'Senha incorreta';
  if(code==='auth/user-not-found') return 'Analista não cadastrado. Peça para um admin cadastrar.';
  if(code==='auth/weak-password') return 'A senha precisa ter ao menos 6 caracteres';
  if(code==='auth/too-many-requests') return 'Muitas tentativas. Aguarde um momento e tente de novo.';
  if(code==='auth/network-request-failed') return 'Sem conexão. Verifique a internet e tente de novo.';
  if(code==='auth/email-already-in-use') return 'Senha incorreta';
  return (err && err.message) ? 'Não foi possível entrar. Tente de novo.' : 'Não foi possível entrar.';
}

async function tryBootstrapAnalyst(user, nome){
  const db=firebase.firestore();
  const initRef=db.doc('team/main/meta/initialized');
  const analystRef=db.doc('team/main/analysts/'+user.uid);
  fbBootstrapInProgress=true;
  try{
    await db.runTransaction(async tx=>{
      const initSnap=await tx.get(initRef);
      if(initSnap.exists) throw new Error('already-initialized');
      tx.set(analystRef,{
        id:user.uid,
        nome:nome,
        isAdmin:true,
        createdAt:new Date().toISOString(),
        email:user.email||analystEmail(nome)
      });
      tx.set(initRef,{ at:new Date().toISOString(), by:user.uid, byNome:nome });
    });
    return true;
  }catch(e){
    return false;
  }finally{
    fbBootstrapInProgress=false;
  }
}

async function doLogin(){
  const nome=(document.getElementById('loginNome').value||'').trim();
  const senha=document.getElementById('loginSenha').value||'';
  if(!nome || !senha){ alert('Preencha nome e senha'); return; }
  if(senha.length<6){ alert('A senha precisa ter ao menos 6 caracteres'); return; }
  if(!window.firebase){ alert('Não foi possível conectar à nuvem. Recarregue a página.'); return; }
  const btn=document.getElementById('loginBtn');
  if(btn){ btn.disabled=true; btn.textContent='Entrando...'; }
  const email=analystEmail(nome);
  try{
    try{
      await firebase.auth().signInWithEmailAndPassword(email, senha);
    }catch(e){
      const code=e && e.code || '';
      if(code==='auth/user-not-found' || code==='auth/invalid-credential' || code==='auth/invalid-login-credentials' || code==='auth/wrong-password'){
        try{
          const cred=await firebase.auth().createUserWithEmailAndPassword(email, senha);
          const ok=await tryBootstrapAnalyst(cred.user, nome);
          if(!ok){
            try{ await cred.user.delete(); }catch(_){}
            try{ await firebase.auth().signOut(); }catch(_){}
            alert('Analista não cadastrado ou senha incorreta. Peça para um admin cadastrar.');
            return;
          }
        }catch(e2){
          if(e2 && e2.code==='auth/email-already-in-use'){
            alert('Senha incorreta');
            return;
          }
          throw e2;
        }
      }else{
        throw e;
      }
    }
    // onAuthStateChanged chama enterApp
  }catch(err){
    console.warn(err);
    alert(authErrorMessage(err));
  }finally{
    if(btn){ btn.disabled=false; btn.textContent='Entrar'; }
  }
}

let syncTimeout = null;
function scheduleTeamSync(){
  if(fbApplying || !fbReady || !currentAnalyst) return;
  markSharedDirty();
  if(syncTimeout) clearTimeout(syncTimeout);
  syncTimeout = setTimeout(()=>{
    if(currentAnalyst) flushToCloud(false).catch(e=>console.warn(e));
  }, 700);
}

function markSharedDirty(){
  FB_COLLECTIONS.forEach(col=>{
    const remote=fbRemote[col]||{};
    (data[col]||[]).forEach(item=>{
      if(!item) return;
      if(!item.id) item.id=uid();
      const prev=remote[item.id];
      if(!prev || recKey(prev)!==recKey(item)){
        fbDirty[col]=fbDirty[col]||{};
        if(fbDirty[col][item.id]!=='delete') fbDirty[col][item.id]='upsert';
      }
    });
    Object.keys(remote).forEach(id=>{
      if(!(data[col]||[]).some(x=>x && x.id===id)){
        fbDirty[col]=fbDirty[col]||{};
        fbDirty[col][id]='delete';
      }
    });
  });
  const metaRemote=fbRemote._metaConfig;
  const metaLocal={
    scriptTagsManaged:data.scriptTagsManaged||[],
    settings:{
      finalIncluirFiscal:!!(data.settings&&data.settings.finalIncluirFiscal),
      finalIncluirPosVenda:!!(data.settings&&data.settings.finalIncluirPosVenda)
    }
  };
  if(!metaRemote || recKey(metaRemote.scriptTagsManaged||[])!==recKey(metaLocal.scriptTagsManaged) || recKey(metaRemote.settings||{})!==recKey(metaLocal.settings)){
    fbMetaDirty=true;
  }
}

async function addAudit(action, collection, recordId, title){
  if(!window.firebase || !firebase.auth().currentUser) return;
  const id=uid();
  try{
    await teamRef().collection('auditLogs').doc(id).set({
      at:new Date().toISOString(),
      by:firebase.auth().currentUser.uid,
      byNome:(currentAnalyst && currentAnalyst.nome)||'',
      action:action,
      collection:collection||'',
      recordId:recordId||'',
      title:title||''
    });
  }catch(e){ console.warn('audit', e); }
}

async function flushToCloud(forceAll){
  if(!window.firebase || !firebase.auth().currentUser || !currentAnalyst) return;
  if(forceAll) markSharedDirty();
  const team=teamRef();
  const ops=[];
  const audits=[];
  FB_COLLECTIONS.forEach(col=>{
    const dirty=fbDirty[col]||{};
    Object.keys(dirty).forEach(id=>{
      if(dirty[id]==='delete'){
        ops.push({type:'delete', ref:team.collection(col).doc(id)});
        const prev=(fbRemote[col]||{})[id];
        audits.push({action:'delete', collection:col, recordId:id, title:(prev && (prev.nome||prev.titulo))||id});
      }else{
        const item=(data[col]||[]).find(x=>x && x.id===id);
        if(!item) return;
        const payload=fbSanitize(Object.assign({}, item, {
          updatedAt:item.updatedAt||new Date().toISOString(),
          updatedBy:currentAnalyst.nome
        }));
        ops.push({type:'set', ref:team.collection(col).doc(id), payload});
        audits.push({action:'upsert', collection:col, recordId:id, title:item.nome||item.titulo||id});
      }
    });
  });
  if(fbMetaDirty || forceAll){
    const payload=fbSanitize({
      scriptTagsManaged:data.scriptTagsManaged||[],
      settings:{
        finalIncluirFiscal:!!(data.settings&&data.settings.finalIncluirFiscal),
        finalIncluirPosVenda:!!(data.settings&&data.settings.finalIncluirPosVenda)
      },
      lastTeamSync:new Date().toISOString(),
      updatedBy:currentAnalyst.nome
    });
    ops.push({type:'set', ref:team.collection('meta').doc('config'), payload});
    fbMetaDirty=true;
  }
  if(!ops.length){
    updateSyncStatus('Sincronizado', 'ok');
    return;
  }
  updateSyncStatus('Sincronizando...', 'warn');
  const CHUNK=400;
  for(let i=0;i<ops.length;i+=CHUNK){
    const batch=firebase.firestore().batch();
    ops.slice(i,i+CHUNK).forEach(op=>{
      if(op.type==='delete') batch.delete(op.ref);
      else batch.set(op.ref, op.payload, {merge:true});
    });
    await batch.commit();
  }
  if(forceAll && audits.length>20){
    await addAudit('sync','all','','Sincronização completa ('+audits.length+' itens)');
  }else{
    const byCol={};
    audits.forEach(a=>{
      const k=a.collection+'|'+(a.action==='delete'?'removeu':'atualizou');
      if(!byCol[k]) byCol[k]={action:a.action, collection:a.collection, titles:[], n:0};
      byCol[k].n++;
      if(a.title && byCol[k].titles.length<3) byCol[k].titles.push(a.title);
    });
    for(const g of Object.values(byCol)){
      const extra=g.n>g.titles.length ? ' +'+(g.n-g.titles.length) : '';
      await addAudit(g.action, g.collection, '', (g.titles.join(', ')||g.collection)+extra);
    }
  }
  fbDirty={};
  fbMetaDirty=false;
  data.lastTeamSync=new Date().toISOString();
  persistLocalOnly();
  updateSyncStatus('Sincronizado', 'ok');
}

function applyCollectionSnapshot(col, snap){
  const remoteMap={};
  snap.docs.forEach(d=>{ remoteMap[d.id]=Object.assign({id:d.id}, d.data()); });
  fbRemote[col]=remoteMap;
  fbInitialDone[col]=true;
  const dirty=fbDirty[col]||{};
  const localArr=data[col]||[];
  const localMap={};
  localArr.forEach(x=>{ if(x && x.id) localMap[x.id]=x; });
  const merged=[];
  const seen={};
  Object.keys(remoteMap).forEach(id=>{
    seen[id]=true;
    if(dirty[id] && dirty[id]!=='delete' && localMap[id]) merged.push(localMap[id]);
    else if(dirty[id]==='delete') return;
    else merged.push(remoteMap[id]);
  });
  localArr.forEach(l=>{
    if(!l || !l.id || seen[l.id]) return;
    if(dirty[l.id] && dirty[l.id]!=='delete') merged.push(l);
  });
  data[col]=merged;
  persistLocalOnly();
  if(fbReady) refreshViewsIfNeeded();
}

function refreshViewsIfNeeded(){
  const tag=(document.activeElement && document.activeElement.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||(document.activeElement&&document.activeElement.isContentEditable)) return;
  if(refreshViewsIfNeeded._t) clearTimeout(refreshViewsIfNeeded._t);
  refreshViewsIfNeeded._t=setTimeout(()=>{
    try{
      if(typeof preserveScroll==='function'){
        preserveScroll(()=>{
          if(typeof renderSidebar==='function') renderSidebar();
          if(currentTab==='dashboard' && typeof renderDashboard==='function') renderDashboard();
        });
      }else if(typeof renderSidebar==='function') renderSidebar();
    }catch(e){}
  }, 250);
}

function stopTeamListeners(){
  fbUnsubs.forEach(u=>{ try{ u(); }catch(e){} });
  fbUnsubs=[];
}

function startTeamListeners(){
  stopTeamListeners();
  FB_COLLECTIONS.forEach(c=>{ fbInitialDone[c]=false; });
  fbAnalystsReady=false;
  fbMetaReady=false;
  const team=teamRef();
  FB_COLLECTIONS.forEach(col=>{
    const unsub=team.collection(col).onSnapshot(snap=>{
      applyCollectionSnapshot(col, snap);
    }, err=>{
      console.warn(err);
      updateSyncStatus('Erro na sincronização', 'warn');
    });
    fbUnsubs.push(unsub);
  });
  fbUnsubs.push(team.collection('analysts').onSnapshot(snap=>{
    analysts=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    try{ localStorage.setItem(ANALYSTS_KEY, JSON.stringify(analysts.map(a=>({id:a.id,nome:a.nome,isAdmin:!!a.isAdmin,createdAt:a.createdAt||''})))); }catch(e){}
    fbAnalystsReady=true;
    const btnA=document.getElementById('btnAnalysts');
    if(btnA && currentAnalyst) btnA.style.display=currentAnalyst.isAdmin?'inline-flex':'none';
    const box=document.getElementById('analystManagerList');
    if(box && typeof openAnalystManager==='function' && document.getElementById('newAnalystName')){
      // lista viva no modal, se aberto — não reabre o modal inteiro
    }
  }, err=>console.warn(err)));
  fbUnsubs.push(team.collection('meta').doc('config').onSnapshot(snap=>{
    fbMetaReady=true;
    if(!snap.exists){ fbRemote._metaConfig=null; return; }
    const m=snap.data()||{};
    fbRemote._metaConfig={ scriptTagsManaged:m.scriptTagsManaged||[], settings:m.settings||{} };
    if(m.scriptTagsManaged) data.scriptTagsManaged=m.scriptTagsManaged;
    if(m.settings && data.settings){
      if(m.settings.finalIncluirFiscal!=null) data.settings.finalIncluirFiscal=m.settings.finalIncluirFiscal;
      if(m.settings.finalIncluirPosVenda!=null) data.settings.finalIncluirPosVenda=m.settings.finalIncluirPosVenda;
    }
    if(m.lastTeamSync) data.lastTeamSync=m.lastTeamSync;
    persistLocalOnly();
  }, err=>{ fbMetaReady=true; console.warn(err); }));
  fbUnsubs.push(team.collection('auditLogs').orderBy('at','desc').limit(80).onSnapshot(snap=>{
    fbAuditLogs=snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    const box=document.getElementById('auditLogList');
    if(box) box.innerHTML=renderAuditList();
  }, err=>console.warn(err)));
}

function waitFirstSnapshots(timeoutMs){
  return new Promise(resolve=>{
    const start=Date.now();
    const tick=()=>{
      const cols=FB_COLLECTIONS.every(c=>fbInitialDone[c]);
      if((cols && fbAnalystsReady && fbMetaReady) || Date.now()-start>(timeoutMs||15000)) resolve();
      else setTimeout(tick, 50);
    };
    tick();
  });
}

function gatherLocalMigration(){
  const mergeIn=(col, items)=>{
    if(!items) return;
    data[col]=data[col]||[];
    items.forEach(item=>{
      if(!item) return;
      if(!item.id) item.id=uid();
      if(!data[col].some(x=>x && x.id===item.id)) data[col].push(item);
    });
  };
  Object.keys(localStorage).forEach(k=>{
    if(k.indexOf('personal_')!==0) return;
    try{
      const p=JSON.parse(localStorage.getItem(k)||'{}')||{};
      mergeIn('clients', p.clients);
      mergeIn('agenda', p.agenda);
      mergeIn('trainings', p.trainings);
      mergeIn('manualSessions', p.manualSessions);
    }catch(e){}
  });
}

async function maybeMigrateToCloud(){
  const empty=FB_COLLECTIONS.every(col=>!fbRemote[col] || !Object.keys(fbRemote[col]).length);
  if(!empty) return false;
  gatherLocalMigration();
  (data.clients||[]).forEach(c=>{ try{ normalizeClient(c); }catch(e){} });
  await flushToCloud(true);
  return true;
}

async function loadAnalystDoc(uid, retries){
  for(let i=0;i<(retries||20);i++){
    try{
      const snap=await firebase.firestore().doc('team/main/analysts/'+uid).get();
      if(snap.exists) return Object.assign({id:snap.id}, snap.data());
    }catch(e){ console.warn(e); }
    if(!fbBootstrapInProgress && i>=12) break;
    await new Promise(r=>setTimeout(r, 300));
  }
  return null;
}

async function enterApp(user){
  if(fbEntering) return;
  fbEntering=true;
  updateSyncStatus('Conectando...', 'warn');
  try{
    const profile=await loadAnalystDoc(user.uid, 12);
    if(!profile){
      try{ await firebase.auth().signOut(); }catch(e){}
      alert('Seu acesso não está cadastrado. Peça para um admin.');
      showLogin();
      return;
    }
    currentAnalyst=profile;
    localStorage.setItem('currentAnalystId', currentAnalyst.id);
    loadPersonalData();
    const overlay=document.getElementById('loginOverlay');
    if(overlay) overlay.style.display='none';
    document.getElementById('app').style.display='';
    const btnA=document.getElementById('btnAnalysts');
    if(btnA) btnA.style.display=currentAnalyst.isAdmin?'inline-flex':'none';
    startTeamListeners();
    await waitFirstSnapshots(15000);
    const migrated=await maybeMigrateToCloud();
    try{
      ensureWikiSeed();
      ensureBitrixTemplates();
      ensureDefaultScripts();
      ensureGamification();
      bootstrapXPFromData();
    }catch(e){ console.warn(e); }
    if(migrated) await flushToCloud(true);
    else { markSharedDirty(); await flushToCloud(false); }
    fbReady=true;
    updateSyncStatus('Sincronizado', 'ok');
    if(typeof renderSidebar==='function') renderSidebar();
    if(currentTab==='dashboard' && typeof renderDashboard==='function') renderDashboard();
    else if(typeof switchTab==='function') switchTab(currentTab||'dashboard');
  }catch(e){
    console.warn(e);
    updateSyncStatus('Falha ao conectar', 'warn');
    showToast('Não foi possível carregar os dados da nuvem agora.');
  }finally{
    fbEntering=false;
  }
}

async function addAnalyst(){
  const nome=(document.getElementById('newAnalystName').value||'').trim();
  const senha=(document.getElementById('newAnalystPass')&&document.getElementById('newAnalystPass').value)||'';
  if(!nome) return;
  if(!senha || senha.length<6){ showToast('Informe uma senha inicial com ao menos 6 caracteres'); return; }
  if(analysts.some(a=>a.nome.toLowerCase()===nome.toLowerCase())){ showToast('Já existe'); return; }
  try{
    const secondary=getSecondaryAuth();
    if(!secondary){ showToast('Nuvem indisponível'); return; }
    const cred=await secondary.createUserWithEmailAndPassword(analystEmail(nome), senha);
    await firebase.firestore().doc('team/main/analysts/'+cred.user.uid).set({
      id:cred.user.uid,
      nome,
      isAdmin:false,
      createdAt:new Date().toISOString(),
      email:cred.user.email||analystEmail(nome)
    });
    try{ await secondary.signOut(); }catch(e){}
    await addAudit('create','analysts', cred.user.uid, nome);
    openAnalystManager();
    showToast('Analista adicionado');
  }catch(e){
    console.warn(e);
    if(e && e.code==='auth/email-already-in-use') showToast('Já existe um acesso com esse nome');
    else if(e && e.code==='auth/weak-password') showToast('A senha precisa ter ao menos 6 caracteres');
    else showToast('Não foi possível cadastrar o analista');
  }
}

async function removeAnalyst(id){
  if(!currentAnalyst || !currentAnalyst.isAdmin){ showToast('Apenas Admin'); return; }
  if(id===currentAnalyst.id){ showToast('Você não pode remover a si mesmo'); return; }
  const alvo=analysts.find(a=>a.id===id);
  if(!confirm('Remover '+(alvo&&alvo.nome?alvo.nome:'este analista')+'? A pessoa perde o acesso aos dados da equipe.')) return;
  try{
    await firebase.firestore().doc('team/main/analysts/'+id).delete();
    await addAudit('delete','analysts', id, (alvo&&alvo.nome)||id);
    openAnalystManager();
    showToast('Analista removido');
  }catch(e){
    console.warn(e);
    showToast('Não foi possível remover');
  }
}

async function syncToTeam(){
  if(!currentAnalyst){ showToast('Faça login'); return; }
  updateSyncStatus('Sincronizando...', 'warn');
  try{
    await flushToCloud(true);
    updateSyncStatus('Sincronizado', 'ok');
    showToast('Sincronizado com a equipe!');
  }catch(e){
    console.warn(e);
    updateSyncStatus('Falha ao sincronizar', 'warn');
    showToast('Não foi possível sincronizar agora. Tente de novo.');
  }
}

function updateSyncStatus(text, type){
  let el = document.getElementById('syncStatus');
  if(!el){
    el = document.createElement('span');
    el.id = 'syncStatus';
    el.style.cssText = 'font-size:.7rem;margin-left:8px;padding:2px 6px;border-radius:4px';
    const top = document.querySelector('.topbar');
    if(top) top.appendChild(el);
  }
  el.textContent = text;
  el.style.background = type==='ok' ? 'rgba(34,197,94,.2)' : type==='warn' ? 'rgba(234,179,8,.2)' : 'transparent';
  el.style.color = type==='ok' ? '#22c55e' : type==='warn' ? '#eab308' : '#94a3b8';
}

function exportTeamData(){
  const teamData = {
    version: 2,
    updatedAt: new Date().toISOString(),
    updatedBy: currentAnalyst ? currentAnalyst.nome : 'desconhecido',
    clients: data.clients || [],
    agenda: data.agenda || [],
    scripts: data.scripts || [],
    casos: data.casos || [],
    trainings: data.trainings || [],
    manualSessions: data.manualSessions || [],
    bitrixTemplates: data.bitrixTemplates || [],
    scriptTagsManaged: data.scriptTagsManaged || []
  };
  const blob = new Blob([JSON.stringify(teamData, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'beefood_team_data.json';
  a.click();
  showToast('Arquivo da equipe exportado');
}

function importTeamData(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const team = JSON.parse(e.target.result);
      ['clients','agenda','scripts','casos','trainings','manualSessions','bitrixTemplates'].forEach(col=>{
        if(team[col]) data[col]=team[col];
      });
      if(team.clients) data.clients=team.clients.map(c=>{ try{ return normalizeClient(c); }catch(err){ return c; } });
      if(team.scriptTagsManaged) data.scriptTagsManaged = team.scriptTagsManaged;
      save();
      if(typeof flushToCloud==='function') flushToCloud(true).catch(()=>{});
      showToast('Dados da equipe importados!');
      if(typeof renderScriptsHome==='function') renderScriptsHome();
      if(typeof renderSidebar==='function') renderSidebar();
    } catch(err){ showToast('Arquivo inválido'); }
  };
  reader.readAsText(file);
}

async function loadFromTeam(){
  if(!currentAnalyst){ showToast('Faça login'); return; }
  updateSyncStatus('Carregando...', 'warn');
  try{
    if(!window.firebase || !firebase.auth().currentUser) throw new Error('Sem sessão');
    const team=teamRef();
    for(const col of FB_COLLECTIONS){
      const snap=await team.collection(col).get();
      applyCollectionSnapshot(col, snap);
    }
    const meta=await team.collection('meta').doc('config').get();
    if(meta.exists){
      const m=meta.data()||{};
      if(m.scriptTagsManaged) data.scriptTagsManaged=m.scriptTagsManaged;
      if(m.settings && data.settings){
        if(m.settings.finalIncluirFiscal!=null) data.settings.finalIncluirFiscal=m.settings.finalIncluirFiscal;
        if(m.settings.finalIncluirPosVenda!=null) data.settings.finalIncluirPosVenda=m.settings.finalIncluirPosVenda;
      }
    }
    persistLocalOnly();
    updateSyncStatus('Atualizado', 'ok');
    showToast('Dados da equipe carregados!');
    if(typeof renderScriptsHome==='function') renderScriptsHome();
    if(typeof renderSidebar==='function') renderSidebar();
    if(currentTab==='dashboard' && typeof renderDashboard==='function') renderDashboard();
  }catch(e){
    console.warn(e);
    updateSyncStatus('Falha ao atualizar', 'warn');
    showToast('Não foi possível atualizar agora. Tente de novo.');
  }
}

  {titulo:'Go-live (entrada em operação real)',texto:'Hoje é o grande dia do seu Go-Live, quando você começa a operar oficialmente com o BeeFood!\n\nAntes de abrir as portas ou o delivery hoje, recomendo fazermos um checklist rápido juntos:\n1. Realize um pedido de teste no PDV e verifique a impressão na cozinha.\n2. Faça o teste de abertura de caixa e lançamento do troco inicial.\n3. Se usar cardápio digital ou WhatsApp, faça um teste pelo celular para checar a chegada do pedido.\n\nEstou por aqui acompanhando você durante esta primeira operação. Qualquer dúvida na rotina, me chame!',tags:['geral','go-live']},

  // === CARDÁPIO [CARD] ===
  {titulo:'Opções de cadastro do cardápio',texto:'Para você cadastrar os seus produtos no BeeFood, temos três formas bem práticas disponíveis:\n1. Importação via iFood: o sistema puxa automaticamente as fotos, nomes e preços direto do seu link do iFood.\n2. Leitura por I.A. (PDF ou Fotos): você envia a imagem ou PDF do seu cardápio e a nossa I.A. digitaliza e organiza as categorias e adicionais.\n3. Planilha Excel: você preenche a nossa planilha modelo e importa tudo de uma vez.\n\nQual dessas opções você prefere utilizar para começarmos?',tags:['cardápio']},
  {titulo:'Migração de sistemas concorrentes (Saipos / Anota Aí)',texto:'Se você utiliza sistemas como Saipos ou Anota Aí, você pode extrair seu cardápio facilmente para a nossa I.A. cadastrar no BeeFood!\n\nComo você pode fazer:\n1. Abra o seu cardápio web antigo no navegador do computador.\n2. Pressione as teclas \'Ctrl + P\' (ou clique no menu do navegador em Imprimir).\n3. Na opção de impressora, selecione \'Salvar como PDF\' e salve o arquivo no seu computador.\n4. Envie esse arquivo PDF aqui para nós ou suba no painel do BeeFood em \'Cardápio > Importar via I.A.\'.\n\nA nossa tecnologia lerá os produtos, preços e grupos de opções para você conferir!',tags:['cardápio']},
  {titulo:'Acompanhamento de cadastro do cardápio',texto:'Vi que você iniciou a etapa de cadastro do cardápio!\n\nVocê conseguiu realizar essa etapa por aí ou teve alguma dúvida ou dificuldade na hora de cadastrar os produtos e complementos?\n\nMe avise por aqui se precisar de ajuda para organizarmos essa etapa juntos!',tags:['cardápio']},
  {titulo:'Cardápio digital e link da loja',texto:'O seu Cardápio Digital é o seu canal próprio de vendas sem taxas!\n\nPara você configurar e personalizar a sua página:\n1. Acesse \'Configurações > Cardápio Digital\'.\n2. Faça o upload da sua Logomarca e Banner de topo.\n3. Defina o seu Link Exclusivo (ex: beefood.com.br/sualoja).\n4. Escolha as formas de pagamento aceitas e habilite as categorias que ficarão visíveis online.\n\nVocê pode colar esse link na bio do seu Instagram ou enviar no WhatsApp. Vamos personalizar sua página agora?',tags:['cardápio']},
  {titulo:'Horários de atendimento e pausa rápida',texto:'Você tem controle total sobre quando seu cardápio recebe pedidos!\n\nPara configurar seus horários e pausas:\n1. Acesse \'Cardápio Digital > Horários de Funcionamento\' e marque as faixas de horário de cada dia da semana. O cardápio abrirá e fechará sozinho nos horários programados.\n2. Se a cozinha apertar ou um ingrediente acabar durante o expediente, use o botão \'Pausa Rápida\' no painel para pausar um produto específico ou fechar a loja temporariamente com 1 clique.\n\nFicou clara a diferença entre o horário programado e a pausa rápida?',tags:['cardápio']},
  {titulo:'Áreas e taxas de entrega',texto:'Para o seu cardápio digital cobrar a taxa de entrega correta, você pode escolher dois modelos:\n- Por Bairros: em \'Configurações > Entregas > Por Bairro\', você cadastra os nomes dos bairros e digita o valor fixo de cada um.\n- Por Raio (Distância em KM): em \'Configurações > Entregas > Por Raio\', você define o valor cobrado por quilômetro até a casa do cliente.\n\nQual desses dois formatos você prefere utilizar na sua região?',tags:['cardápio']},

  {titulo:'Integração iFood e vínculo de produtos',texto:'Com a integração do iFood, os pedidos do app entram direto no BeeFood. Porém, para o sistema saber o que imprimir na cozinha e o que baixar do estoque, você precisará fazer o \'Vínculo de Produtos\'.\n\nPor que o vínculo é necessário?\nO sistema não adivinha que dois produtos são iguais se o nome estiver levemente diferente (exemplo: na BeeFood cadastrado como \'Marmita de Soja\' e no iFood como \'Marmita Soja\').\n\nComo você faz esse vínculo no painel:\n1. Acesse no BeeFood o menu \'Integrações > iFood > Mapeamento de Produtos\'.\n2. Relacione cada produto do iFood ao seu produto correspondente cadastrado na BeeFood.\n3. Faça o mesmo na aba \'Mapeamento de Pagamentos\'.\n\nQuer que eu te mostre a tela de mapeamento para você fazer o primeiro vínculo?',tags:['integrações','ifood']},
  {titulo:'Entrega Fácil iFood',texto:'O Entrega Fácil permite solicitar motoboys parceiros da frota do iFood para entregar os pedidos do seu Cardápio Digital ou WhatsApp!\n\nComo você vai configurar e utilizar:\n1. No Portal do Parceiro iFood: vá em \'Serviços > Entrega Sob Demanda / Entrega Fácil\' e confirme se o serviço está ATIVO.\n2. No BeeFood: cadastre suas taxas de entrega em \'Configurações > Entregas\' com valores semelhantes aos do iFood. (Vale lembrar que o iFood pode aplicar taxas dinâmicas em dias de chuva ou horários de pico, cobradas diretamente por eles).\n3. Para chamar o motoboy: quando receber o pedido no BeeFood, abra a comanda, vá na etapa \'Adicionar Entregador\' e selecione \'Solicitar Motoboy Entrega Fácil\'.\n\nO iFood localizará o entregador mais próximo e atualizará o rastreio na sua tela. Vamos verificar se o serviço já está ativo no seu portal do iFood?',tags:['integrações','ifood']},
  {titulo:'Integrações Keeta e 99Food',texto:'Para você integrar a Keeta e a 99Food ao seu sistema BeeFood:\n\n- Para a Keeta: acesse \'Integrações > Keeta\' no BeeFood e insira o seu Keeta ID, e-mail de login (no formato @m.meet.com) e a senha enviada no e-mail de boas-vindas da Keeta.\n- Para a 99Food: acesse seu portal da 99Food, copie o seu \'Store ID\' em Perfil da Loja e cole no BeeFood em \'Integrações > 99Food\'.\n\nConseguindo preencher esses dados, seus pedidos dessas duas plataformas caindo juntos na sua tela de produção!',tags:['integrações']},
  {titulo:'Bot de atendimento e boletim diário no WhatsApp',texto:'O módulo de WhatsApp do BeeFood possui duas funções incríveis para o seu negócio:\n\n1. Bot de Atendimento: responde seus clientes instantaneamente com o link do cardápio digital. Para ativar, vá em \'Módulos > Bot WhatsApp\' e leia o QR Code com a câmera do seu WhatsApp em \'Dispositivos Conectados\'.\n2. Boletim Diário: envia um resumo das vendas do dia no WhatsApp dos sócios ao fechar o caixa. Basta cadastrar os números em \'Módulos > Boletim WhatsApp\'.\n\nPodemos gerar o QR Code na tela para você conectar o WhatsApp da loja agora?',tags:['integrações','whatsapp']},

  // === PRESENCIAL / PDV [PDV] ===

  {titulo:'Abertura, sangria e fechamento de caixa',texto:'A gestão de caixa garante que todas as entradas e saídas de valores do dia fiquem auditadas.\n\nComo funciona a rotina no sistema:\n- Abertura de Caixa: no início do turno, acesse \'Caixa > Abrir\' e digite o valor de troco inicial colocado na gaveta.\n- Sangria: quando retirar dinheiro do caixa para pagar um fornecedor ou guardar no cofre, acesse \'Caixa > Sangria\', digite o valor e a justificativa.\n- Fechamento Cego: ao fim do turno, acesse \'Caixa > Fechar\'. O operador digita o total contado fisicamente na gaveta sem ver o valor do sistema, garantindo um fechamento 100% auditável.\n\nFicou clara a diferença entre sangria e fechamento cego de caixa?',tags:['presencial']},
  {titulo:'Mesas, comandas e fiado',texto:'O módulo de Salão e Contas a Receber permite organizar todo o consumo interno e vendas a prazo do seu estabelecimento:\n\n- Para Salão: acesse \'Mesas\', abra a conta desejada e lance os itens. O sistema imprime as comandas na cozinha e calcula a taxa de serviço (ex: 10%) no fechamento.\n- Para Fiado/Venda a Prazo: no momento do pagamento, selecione a opção \'Fiado\', escolha o cliente pré-cadastrado no sistema e confirme. O débito ficará registrado na ficha do cliente para baixa futura em \'Contas a Receber\'.\n\nQuer cadastrar uma mesa ou testar um lançamento a prazo no sistema?',tags:['presencial']},

  // === IMPRESSÃO [IMP] ===
  {titulo:'Cadastro e configuração de impressoras por setor',texto:'Para que suas comandas de produção saiam automaticamente no setor correto (ex: bebidas no bar, lanches na cozinha), você configurará o direcionamento por categorias.\n\nComo você vai fazer:\n1. Certifique-se de que a impressora está imprimindo a página de teste do Windows.\n2. No BeeFood, acesse \'Configurações > Impressão > Cadastrar Impressora\' e selecione o dispositivo.\n3. Vá na aba \'Mapeamento de Setores\' e vincule cada categoria à sua impressora de destino (ex: Bebidas -> Bar; Hambúrgueres -> Cozinha).\n4. Ative a chave \'Impressão Automática ao Aceitar Pedido\'.\n\nSe a sua impressora ainda não estiver instalada no Windows, posso te orientar por acesso remoto para deixarmos tudo testado! Quando fica bom para conectarmos?',tags:['impressão']},

  // === ESTOQUE [EST] ===
  {titulo:'Ordem recomendada de cadastro e controle de estoque',texto:'Para o seu controle de estoque funcionar perfeitamente e sem divergências, recomendamos seguir esta ordem exata de cadastro:\n\n1. Insumos (Matéria-Prima): primeiro, cadastre os ingredientes brutos em \'Estoque > Insumos\' (ex: carnes, verduras, molhos base, temperos).\n2. Produtos Prontos: em \'Cardápio > Produtos\', cadastre os itens de revenda direta que não possuem preparo (ex: refrigerantes, águas, cervejas).\n3. Receitas (Produção Interna): se você produz algo em lote na loja (ex: um molho especial), vá em \'Estoque > Receitas\'. Cadastre os insumos utilizados, as quantidades e quanto a receita rende (ex: rende 5kg de molho).\n4. Lançamento de Produção: quando a cozinha preparar esse lote (ex: fez 5kg de molho hoje), vá em \'Estoque > Produção\' e lance a quantidade. O sistema dará baixa nos insumos primários automaticamente.\n5. Ficha Técnica do Prato: por fim, em \'Cardápio > Produtos > Ficha Técnica\', informe quanto de cada insumo ou receita vai em 1 porção vendida (ex: 1 porção de Yakissoba usa 200g de acelga e 50g do molho produzido).\n\nDessa forma, o BeeFood controlará o saldo de matérias-primas, as produções internas e a baixa de ingredientes por prato vendido no caixa ou delivery!\n\nFicou clara essa sequência de cadastro para a sua cozinha?',tags:['estoque']},
  {titulo:'Estoque simples vs estoque avançado',texto:'Você pode gerenciar o seu estoque no BeeFood de duas formas:\n\n- Estoque Simples: ideal para bebidas e revenda. Você digita a quantidade inicial e o sistema desconta 1 unidade a cada venda finalizada no PDV.\n- Estoque Avançado (XML e Inventário): permite dar entrada em notas fiscais de fornecedores subindo o arquivo XML em \'Estoque > Entrada por XML\' (o sistema atualiza o custo médio e saldo sozinho) e realizar acertos de perdas através do \'Inventário de Estoque\'.\n\nQual desses dois níveis de estoque você deseja implementar na sua loja primeiro?',tags:['estoque']},

  // === FISCAL [FIS] ===
  {titulo:'Configuração fiscal e dados de certificado digital',texto:'Para que o BeeFood possa emitir seus cupons fiscais (NFC-e) ou notas de venda (NF-e), você precisará cadastrar as credenciais da sua empresa.\n\nComo preencher no painel:\n1. Acesse \'Configurações > Módulo Fiscal > Certificado Digital\'.\n2. Importe o arquivo do seu Certificado Digital A1 (.PFX ou .P12) e digite a senha.\n3. Insira o seu código CSC e o ID Token (emitidos no site da SEFAZ pelo seu contador).\n4. Clique em \'Validar e Salvar\'.\n\nVocê já possui o arquivo do Certificado A1 salvo no seu computador para realizarmos o upload?',tags:['fiscal']},
  {titulo:'Consulta de série e último número de nota emitida',texto:'Para deixarmos a sua emissão fiscal configurada sem rejeições na SEFAZ, preciso confirmar uma informação importante:\n\nVocê já emitia nota fiscal em outro sistema ou este será o seu primeiro sistema para emissão de notas?\n\n- Se já emitia antes: vou precisar confirmar com você (ou com o seu contador) qual é o Número da Série e qual foi o Número da Última Nota emitida no sistema antigo, para colocarmos o próximo número correto aqui no BeeFood.\n- Se vai começar do zero agora: podemos iniciar direto com a Série 1 e a Nota número 1.\n\nVocê prefere verificar essa informação no seu sistema antigo ou nos passar o contato do seu contador para alinharmos?',tags:['fiscal']},
  {titulo:'Parametrização tributária (NCM, CFOP) e emissão de teste',texto:'Após cadastrar o certificado e os números de nota, vinculamos a tributação nos seus produtos (NCM e CFOP) para transmitir o primeiro cupom de teste.\n\nComo proceder:\n1. Em \'Cardápio > Categorias\', preencha o código NCM e CFOP indicados pelo seu contador.\n2. No PDV, realize uma venda de teste no valor de R$ 1,00 com a opção \'Emitir NFC-e\' marcada.\n3. O BeeFood transmitirá a nota para a SEFAZ e imprimirá o cupom com o QR Code fiscal.\n\nSe precisar de auxílio com o cardápio ou impressoras enquanto aguarda os dados fiscais do contador, é só me chamar por aqui!',tags:['fiscal']},

  // === MARKETING [MKT] ===
  {titulo:'Cupons de desconto e campanhas de CRM',texto:'O módulo de Marketing do BeeFood é excelente para atrair novos clientes e reativar quem não compra há algum tempo!\n\nVocê pode criar duas ações principais:\n1. Cupons de Desconto: em \'Food Marketing > Cupons\', crie códigos promocionais (ex: PRIMEIRACOMPRA ou FRETEGRATIS) com valor mínimo de pedido e validade.\n2. Campanhas de CRM: em \'Food Marketing > CRM\', filtre clientes inativos há mais de 30 dias e dispare uma mensagem no WhatsApp com o link do seu cardápio e um cupom especial.\n\nQuer elaborar a sua primeira campanha de reativação para este final de semana?',tags:['marketing']},

  // === TROUBLESHOOTING [SUP] ===
  {titulo:'Diagnóstico: pedido não saiu na impressora da cozinha',texto:'Se um pedido entrou no sistema mas não saiu impresso na cozinha, siga estes passos para identificar o motivo:\n\n1. Verifique se o Caixa do dia está Aberto (se o caixa estiver fechado, a produção não imprime).\n2. Verifique se a impressora está ligada, com papel e sem luz de erro acesa.\n3. Confirme se o aplicativo \'BeeFood Print\' está aberto e conectado na barra de tarefas do Windows.\n4. Vá em \'Configurações > Impressão\' e confirme se a categoria do produto vendido está vinculada àquela impressora.\n5. No painel de pedidos, clique no pedido e selecione \'Reimprimir Comanda\'.\n\nConseguiu verificar se o aplicativo BeeFood Print estava ativo no seu computador?',tags:['troubleshooting','impressão']},
  {titulo:'Diagnóstico: pedido do iFood não caiu no BeeFood',texto:'Se os pedidos do iFood pararam de entrar automaticamente na sua tela do BeeFood, faça estas checagens:\n\n1. Confirme se o Caixa do BeeFood está aberto no computador principal.\n2. Acesse \'Integrações > iFood\' e verifique se a chave \'Captura de Pedidos\' está ATIVADA.\n3. Se a integração constar como desconectada, clique em \'Reconectar\', gere um novo Código de Autorização no Portal do Parceiro iFood e cole no BeeFood.\n4. Clique no botão \'Sincronizar Pedidos Pendentes\' para puxar as vendas represadas.\n\nO status da sua integração voltou a aparecer como conectado no painel?',tags:['troubleshooting','ifood']},
  {titulo:'Diagnóstico: loja aparece como fechada no cardápio digital',texto:'Se o seu Cardápio Digital está aparecendo como \'Fechado\' para os seus clientes enquanto sua loja está aberta, verifique estes 3 pontos no painel:\n\n1. Acesse \'Cardápio Digital > Status\' e confirme se a \'Pausa Rápida / Fechar Loja\' não foi ativada por engano.\n2. Acesse \'Cardápio Digital > Horários\' e confirme se a grade de horários do dia de hoje está preenchida corretamente.\n3. Verifique se o fuso horário do seu computador/cidade está correto nas configurações do sistema.\n\nApós ajustar, atualize o link do cardápio no seu celular. A loja voltou a exibir a opção \'Aberta\'?',tags:['troubleshooting','cardápio']}
];

function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(iso){if(!iso)return '—';try{return new Date(iso).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return String(iso)}}
function preserveScroll(fn){
  const el=document.querySelector('.main-content');
  const y=el?el.scrollTop:0;
  const x=window.scrollY||0;
  fn();
  requestAnimationFrame(()=>{
    const el2=document.querySelector('.main-content');
    if(el2) el2.scrollTop=y;
    window.scrollTo(0,x);
  });
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._tm);t._tm=setTimeout(()=>t.style.display='none',2800)}
function daysSince(iso){if(!iso)return 999;return Math.floor((Date.now()-new Date(iso).getTime())/86400000)}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mapTasks(list){return (list||[]).map(t=>({id:uid(),texto:t,done:false}))}

function createClient(d){const now=new Date().toISOString();return{id:uid(),nome:d.nome||'',codigo:d.codigo||'',telefone:d.telefone||'',prioridade:d.prioridade||'media',tipo:d.tipo||'completo',tags:d.tags||[],cor:d.cor||'#3b82f6',observacoes:d.observacoes||'',slaDate:d.slaDate||'',uf:d.uf||'',modeloFiscal:d.modeloFiscal||'',cscId:d.cscId||'',cscToken:d.cscToken||'',certificadoTipo:d.certificadoTipo||'',certificadoValidade:d.certificadoValidade||'',stoneCode:d.stoneCode||'',pinpadPorta:d.pinpadPorta||'',posVendaD7:false,posVendaD30:false,handoffNote:'',pessoal:mapTasks(PESSOAL_DEFAULT),roteiro:mapTasks(ROTEIRO_DEFAULT),implementacao:mapTasks(IMPL_DEFAULT),alertas:[],history:[],archived:false,createdAt:now,updatedAt:now,lastAccessedAt:now,goLiveAt:null}}
function normalizeClient(c){if(!c.pessoal)c.pessoal=mapTasks(PESSOAL_DEFAULT);if(!c.roteiro)c.roteiro=mapTasks(ROTEIRO_DEFAULT);if(!c.implementacao)c.implementacao=mapTasks(IMPL_DEFAULT);if(!c.alertas)c.alertas=[];if(!c.history)c.history=[];if(!c.tags)c.tags=[];['uf','modeloFiscal','cscId','cscToken','certificadoTipo','certificadoValidade','stoneCode','pinpadPorta','handoffNote'].forEach(k=>{if(c[k]==null)c[k]=''});if(c.posVendaD7==null)c.posVendaD7=false;if(c.posVendaD30==null)c.posVendaD30=false;if(!c.cor)c.cor='#3b82f6';return c}

function getStatus(c){const all=[...(c.pessoal||[]),...(c.roteiro||[]),...(c.implementacao||[])];if(!all.length)return 'nao_iniciado';const d=all.filter(t=>t.done).length;if(!d)return 'nao_iniciado';if(d===all.length)return 'concluido';return 'em_andamento'}
function getSlaStatus(c){if(!c.slaDate)return null;const end=new Date(c.slaDate+'T23:59:59');const diff=Math.ceil((end-Date.now())/86400000);if(getStatus(c)==='concluido')return{label:'OK',cls:'badge-sla-ok',days:diff};if(diff<0)return{label:'Atrasado '+Math.abs(diff)+'d',cls:'badge-sla-late',days:diff};if(diff<=2)return{label:diff+'d',cls:'badge-sla-warn',days:diff};return{label:diff+'d',cls:'badge-sla-ok',days:diff}}
function touch(c){c.updatedAt=new Date().toISOString();c.lastAccessedAt=c.updatedAt}
function addHistory(c,text){if(!c.history)c.history=[];c.history.unshift({id:uid(),text,at:new Date().toISOString()});if(c.history.length>80)c.history=c.history.slice(0,80)}
function progressOf(c){const all=[...(c.pessoal||[])];const done=all.filter(t=>t.done).length,total=all.length||1;return{done,total,percent:Math.round(done/total*100)}}
function fiscalChecklist(c){const modelo=c.modeloFiscal||'';const needCsc=!modelo||modelo==='NFCe';return{uf:!!c.uf,modelo:!!c.modeloFiscal,csc:needCsc?!!(c.cscId&&c.cscToken):true,cert:!!c.certificadoTipo,tef:!!(c.stoneCode||c.pinpadPorta),sugestao:c.uf?(FISCAL_UF[c.uf]||''):''}}

function ensureGamification(){if(!data.gamification)data.gamification={xp:0,events:[],badgesUnlocked:[],activityDays:[],bootstrapped:false};if(!data.gamification.events)data.gamification.events=[];if(!data.gamification.badgesUnlocked)data.gamification.badgesUnlocked=[];if(!data.gamification.activityDays)data.gamification.activityDays=[]}
function markActivityDay(){ensureGamification();const k=todayKey();if(!data.gamification.activityDays.includes(k)){data.gamification.activityDays.push(k);if(data.gamification.activityDays.length>90)data.gamification.activityDays=data.gamification.activityDays.slice(-90)}}
function addXP(ruleId,meta){ensureGamification();const rule=XP_RULES.find(r=>r.id===ruleId);if(!rule)return;data.gamification.xp=(data.gamification.xp||0)+rule.xp;data.gamification.events.unshift({id:uid(),ruleId,xp:rule.xp,label:rule.label,meta:meta||'',at:new Date().toISOString()});if(data.gamification.events.length>200)data.gamification.events=data.gamification.events.slice(0,200);markActivityDay();refreshBadges(false)}
function calcStreak(days){if(!days||!days.length)return 0;const set=new Set(days);let streak=0;const d=new Date();for(let i=0;i<90;i++){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(set.has(k)){streak++;d.setDate(d.getDate()-1)}else if(i===0){d.setDate(d.getDate()-1);continue}else break}return streak}

function treinoProgress(t){const steps=getTreinoSteps(t.tipo||'completo');let done=0;steps.forEach(s=>{if(t.done&&t.done[s.id])done++});return{done,total:steps.length,percent:steps.length?Math.round(done/steps.length*100):0}}
function computeMetrics(){ensureGamification();const clients=data.clients||[];const active=clients.filter(c=>!c.archived);const goLives=clients.filter(c=>c.goLiveAt||getStatus(c)==='concluido').length;let tasksDone=0,tasksTotal=0;active.forEach(c=>['pessoal','roteiro','implementacao'].forEach(k=>(c[k]||[]).forEach(t=>{tasksTotal++;if(t.done)tasksDone++})));let trainingsDone=0;(data.trainings||[]).forEach(t=>{const p=treinoProgress(t);if(p.total&&p.done===p.total)trainingsDone++});let slaLateActive=0;active.forEach(c=>{const s=getSlaStatus(c);if(s&&s.days<0&&getStatus(c)!=='concluido')slaLateActive++});return{activeClients:active.length,goLives,inProgress:active.filter(c=>getStatus(c)==='em_andamento').length,notStarted:active.filter(c=>getStatus(c)==='nao_iniciado').length,tasksDone,tasksTotal,trainings:(data.trainings||[]).length,trainingsDone,wikiOwn:(data.casos||[]).filter(c=>!c.seed).length,fiscalFilled:clients.filter(c=>c.uf&&c.modeloFiscal).length,tefFilled:clients.filter(c=>c.stoneCode).length,slaLateActive,xp:data.gamification.xp||0,streak:calcStreak(data.gamification.activityDays||[])}}
function currentLevel(xp){let cur=LEVEL_XP[0];LEVEL_XP.forEach(L=>{if(xp>=L.min)cur=L});const idx=LEVEL_XP.findIndex(l=>l.nivel===cur.nivel);const next=LEVEL_XP[idx+1]||null;const span=next?(next.min-cur.min):1;return{cur,next,pct:next?Math.min(100,Math.round((xp-cur.min)/span*100)):100,need:next?(next.min-xp):0}}
function refreshBadges(doSave){ensureGamification();const m=computeMetrics();const unlocked=new Set(data.gamification.badgesUnlocked||[]);let neu=[];BADGE_DEFS.forEach(b=>{if(!unlocked.has(b.id)&&b.check(m)){unlocked.add(b.id);neu.push(b)}});data.gamification.badgesUnlocked=Array.from(unlocked);if(neu.length&&doSave!==false){save();playDing();showToast('🏅 '+neu.map(b=>b.nome).join(', '))}}
function bootstrapXPFromData(){ensureGamification();if(data.gamification.bootstrapped)return;let xp=0;(data.clients||[]).forEach(c=>{xp+=5;if(c.goLiveAt||getStatus(c)==='concluido')xp+=50;['pessoal','roteiro','implementacao'].forEach(k=>(c[k]||[]).forEach(t=>{if(t.done)xp+=2}))});(data.trainings||[]).forEach(t=>{xp+=5;const p=treinoProgress(t);if(p.total&&p.done===p.total)xp+=40});(data.casos||[]).filter(c=>!c.seed).forEach(()=>xp+=25);data.gamification.xp=Math.max(data.gamification.xp||0,xp);data.gamification.bootstrapped=true;markActivityDay();refreshBadges(false);save()}

function playDing(){
  if(!data.settings||!data.settings.sound) return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(); const g=ctx.createGain();
    o.type='sine'; o.frequency.value=880; g.gain.value=0.08;
    o.connect(g); g.connect(ctx.destination);
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35); o.stop(ctx.currentTime+0.35);
  }catch(e){}
}
function weekKey(d){ const x=new Date(d); const day=x.getDay()||7; x.setHours(0,0,0,0); x.setDate(x.getDate()-day+1); return x.toISOString().slice(0,10); }
function computeWeekStats(){
  const wk=weekKey(new Date());
  let tasks=0, finals=0, trainings=0, wiki=0, xpWeek=0;
  (data.clients||[]).forEach(c=>{
    if(c.goLiveAt && weekKey(c.goLiveAt)===wk) finals++;
  });
  ((data.gamification&&data.gamification.events)||[]).forEach(e=>{
    if(weekKey(e.at)!==wk) return;
    xpWeek += e.xp||0;
    if(e.ruleId==='task_done') tasks++;
    if(e.ruleId==='client_finalize') finals++;
    if(e.ruleId==='training_done') trainings++;
    if(e.ruleId==='wiki_create') wiki++;
  });
  return {tasks, finals, trainings, wiki, xpWeek, wk};
}

function toggleTask(clientId,secao,taskId){
  const c=data.clients.find(x=>x.id===clientId); const t=c[secao].find(i=>i.id===taskId);
  t.done=!t.done; touch(c); addHistory(c,(t.done?'Concluiu: ':'Reabriu: ')+t.texto.slice(0,50));
  if(t.done) addXP('task_done', t.texto.slice(0,40));
  if(getStatus(c)==='concluido'&&!c.goLiveAt) c.goLiveAt=new Date().toISOString();
  save();
  // atualiza só a linha, sem reconstruir a página (evita pular pro topo)
  const row=document.getElementById('task-'+taskId);
  if(row){
    row.classList.toggle('done', !!t.done);
    const cb=row.querySelector('input[type=checkbox]');
    if(cb) cb.checked=!!t.done;
  } else {
    preserveScroll(()=>renderClientDetail());
  }
  // atualiza barra e contadores leves
  const p=progressOf(c);
  const bar=document.querySelector('.main-content .progress-bar');
  if(bar) bar.style.width=p.percent+'%';
  renderSidebar();
}

function startEditObs(id){const c=data.clients.find(x=>x.id===id);const box=document.getElementById('obsBox');if(!box)return;box.onclick=null;box.innerHTML=`<textarea id="obsEdit" style="width:100%;min-height:80px;background:#0f172a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px">${escapeHtml(c.observacoes||'')}</textarea><button class="btn btn-sm btn-success" style="margin-top:4px" onclick="saveObs('${id}')">Salvar</button>`;document.getElementById('obsEdit').focus()}

function toggleTranscription(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){showToast('Use Chrome/Edge');return}const pop=document.getElementById('micPopover'),btn=document.getElementById('btnRec'),st=document.getElementById('transcribeStatus'),res=document.getElementById('transcribeResult');if(pop)pop.style.display='block';if(isRecording&&recognition){recognition.stop();isRecording=false;if(btn){btn.textContent='🎤';btn.classList.remove('recording')}if(st)st.textContent='Parado';return}recognition=new SR();recognition.lang='pt-BR';recognition.continuous=true;recognition.interimResults=true;let finalText=(res&&res.textContent)||'';recognition.onstart=()=>{isRecording=true;if(btn){btn.textContent='⏹';btn.classList.add('recording')}if(st)st.textContent='🔴 Ouvindo...'};recognition.onresult=(ev)=>{let interim='';for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)finalText+=t+' ';else interim+=t}if(res)res.textContent=(finalText+interim).trim()};recognition.onerror=()=>{isRecording=false;if(btn){btn.textContent='🎤';btn.classList.remove('recording')}};recognition.onend=()=>{isRecording=false;if(btn){btn.textContent='🎤';btn.classList.remove('recording')}};recognition.start()}

function parseWhen(str){str=(str||'').trim();if(!str)return null;const now=new Date();if(/^\d{1,2}:\d{2}$/.test(str)){const[h,m]=str.split(':').map(Number);const d=new Date(now);d.setHours(h,m,0,0);if(d<now)d.setDate(d.getDate()+1);return d}const d=new Date(str.replace(' ','T'));return isNaN(d.getTime())?null:d}
function addAlert(clientId){const texto=((document.getElementById('newAlertText')||{}).value||'').trim();const whenStr=((document.getElementById('newAlertWhen')||{}).value||'');if(!texto){showToast('Texto');return}const when=parseWhen(whenStr)||new Date(Date.now()+3600000);const c=data.clients.find(x=>x.id===clientId);c.alertas.push({id:uid(),texto,quando:when.toISOString(),done:false});c.alertas.sort((a,b)=>new Date(a.quando)-new Date(b.quando));touch(c);save();renderClientDetail();showToast('Alerta ok')}

function schedulePosVenda(c){if(!c.alertas)c.alertas=[];const base=new Date(c.goLiveAt||Date.now());const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(10,0,0,0);return x};if(!c.posVendaD7){c.alertas.push({id:uid(),texto:'Pós-venda D+7',quando:addDays(base,7).toISOString(),done:false});c.posVendaD7=true}if(!c.posVendaD30){c.alertas.push({id:uid(),texto:'Pós-venda D+30',quando:addDays(base,30).toISOString(),done:false});c.posVendaD30=true}}
function moduleHints(c){
  const tipo=(c.tipo||'completo').toLowerCase();
  const tags=(c.tags||[]).map(t=>String(t).toLowerCase());
  const obs=(c.observacoes||'').toLowerCase();
  const blob=tags.join(' ')+' '+obs;
  return {
    tipo,
    delivery: tipo==='delivery'||tipo==='completo'||/delivery|ifood|card[aá]pio/.test(blob),
    mesas: tipo==='mesas'||tipo==='completo'||/mesa|comanda|gar[cç]om|qr/.test(blob),
    marketplace: /ifood|marketplace|rappi|uber/.test(blob)||!!c.stoneCode===false&&/ifood/.test(blob),
    fiscal: !!(c.uf||c.modeloFiscal)||/fiscal|nfc|sat|mfe/.test(blob),
    tef: !!(c.stoneCode||c.pinpadPorta)||/tef|stone|pin\s*pad/.test(blob),
    pdv: /pdv|balc[aã]o|balcao/.test(blob)
  };
}

const CONCLUSAO_VARIANTES = [
  {id:'auto', label:'Automático (pelo tipo do cliente)'},
  {id:'completo', label:'Completo — delivery + presencial'},
  {id:'delivery', label:'Só delivery / cardápio'},
  {id:'mesas', label:'Só mesas e comandas'},
  {id:'pdv', label:'Só PDV / balcão'},
  {id:'marketplace', label:'Com ênfase em marketplace'},
  {id:'curto', label:'Versão curta (mínima)'}
];

function buildFinalizacaoText(c, variantId){
  const s=data.settings||{};
  const m=moduleHints(c);
  let v=variantId||'auto';
  if(v==='auto'){
    if(m.tipo==='delivery') v='delivery';
    else if(m.tipo==='mesas') v='mesas';
    else if(m.pdv && !m.mesas) v='pdv';
    else v='completo';
    if(m.marketplace && v==='delivery') v='marketplace';
  }
  const partes=[];
  partes.push('✅ Onboarding finalizado com sucesso');
  partes.push('');
  partes.push('Cliente: '+(c.nome||'—'));
  if(c.codigo) partes.push('Código: '+c.codigo);

  if(v==='curto'){
    partes.push('');
    partes.push('Concluímos as configurações e pendências necessárias.');
    partes.push('O estabelecimento está apto a operar com o BeeFood.');
    return partes.join('\n');
  }

  const tipoLabel={completo:'Completo (delivery + presencial)',delivery:'Delivery / cardápio digital',mesas:'Mesas e comandas',pdv:'PDV / balcão',marketplace:'Delivery com marketplace'}[v]||(c.tipo||'completo');
  partes.push('Perfil: '+tipoLabel);

  if(s.finalIncluirFiscal){
    if(c.uf||c.modeloFiscal) partes.push('Fiscal: '+[c.uf,c.modeloFiscal].filter(Boolean).join(' · '));
    if(c.stoneCode) partes.push('TEF Stone: configurado');
  }

  partes.push('');
  partes.push('Concluímos todas as configurações e pendências necessárias para a operação.');

  const validados=[];
  if(v==='completo'||v==='delivery'||v==='marketplace'){
    validados.push('fluxo de delivery e/ou cardápio digital');
    validados.push('impressão e status de pedidos');
  }
  if(v==='completo'||v==='mesas'){
    validados.push('gestão de mesas/comandas');
    validados.push('lançamento e fechamento presencial');
  }
  if(v==='pdv'){
    validados.push('venda rápida no PDV/balcão');
    validados.push('recebimento e impressão de produção');
  }
  if(v==='marketplace'){
    validados.push('integração e vínculo de produtos de marketplace');
  }
  if(v==='completo'){
    validados.push('abertura e rotina de caixa');
  }
  // dedupe
  const seen=new Set(); const uniq=[];
  validados.forEach(x=>{ if(!seen.has(x)){ seen.add(x); uniq.push(x); }});
  if(uniq.length) partes.push('Foram validados: '+uniq.join('; ')+'.');

  partes.push('O estabelecimento está apto a operar com o BeeFood.');

  if(s.finalIncluirPosVenda){
    partes.push('');
    partes.push('Acompanhamento pós-venda (D+7 e D+30) já foi agendado internamente.');
  }
  return partes.join('\n');
}

function copyPendingPessoal(id){
  const c=data.clients.find(x=>x.id===id); if(!c) return;
  const blocks=[];
  function add(title, arr){
    const pend=(arr||[]).filter(t=>!t.done);
    if(!pend.length) return;
    blocks.push(title);
    pend.forEach(t=>blocks.push('• '+t.texto));
    blocks.push('');
  }
  add('Pendências pessoais', c.pessoal);
  add('Roteiro', c.roteiro);
  add('Implementação', c.implementacao);
  let text;
  if(!blocks.length){
    text='Sem pendências em aberto — '+c.nome+(c.codigo?' ('+c.codigo+')':'');
  } else {
    text='Pendências — '+c.nome+(c.codigo?' ('+c.codigo+')':'')+'\n\n'+blocks.join('\n').trim();
  }
  navigator.clipboard.writeText(text).then(()=>showToast('Pendências copiadas')).catch(()=>{});
}

function showConclusaoMenu(id){
  const c=data.clients.find(x=>x.id===id); if(!c) return;
  const opts=CONCLUSAO_VARIANTES.map((v,i)=>(i+1)+') '+v.label).join('\n');
  const n=parseInt(prompt('Modelo de conclusão:\n'+opts+'\n\nNúmero (Enter = automático):'),10);
  let variant='auto';
  if(n>=1 && n<=CONCLUSAO_VARIANTES.length) variant=CONCLUSAO_VARIANTES[n-1].id;
  const text=buildFinalizacaoText(c, variant);
  navigator.clipboard.writeText(text).then(()=>showToast('Conclusão copiada')).catch(()=>{});
}

function finalizarCliente(id){
  const c=data.clients.find(x=>x.id===id); if(!c) return;
  if(!confirm('Finalizar onboarding e marcar todas as atividades?')) return;
  const opts=CONCLUSAO_VARIANTES.map((v,i)=>(i+1)+') '+v.label).join('\n');
  const n=parseInt(prompt('Qual mensagem de conclusão copiar?\n'+opts+'\n\nNúmero (Enter = automático):'),10);
  let variant='auto';
  if(n>=1 && n<=CONCLUSAO_VARIANTES.length) variant=CONCLUSAO_VARIANTES[n-1].id;
  ['pessoal','roteiro','implementacao'].forEach(k=>(c[k]||[]).forEach(t=>t.done=true));
  if(!c.goLiveAt) c.goLiveAt=new Date().toISOString();
  touch(c); addHistory(c,'Finalizado ('+variant+')'); schedulePosVenda(c); addXP('client_finalize',c.nome); playDing(); save();
  const text=buildFinalizacaoText(c, variant);
  navigator.clipboard.writeText(text).catch(()=>{});
  showToast('Finalizado — conclusão copiada'); renderClientDetail(); renderSidebar();
}

function saveClientModal(){
  const id=document.getElementById('m_id').value;
  const nome=document.getElementById('m_nome').value.trim();
  const codigo=document.getElementById('m_codigo').value.trim();
  const unidadesRaw=document.getElementById('m_unidades').value.trim();
  if(!nome){showToast('Nome obrigatório');return}
  const unidades=unidadesRaw.split('\n').map(line=>{
    const [n,i]=(line.split('|').map(x=>x.trim()));
    return n?{nome:n,id:i||''}:null;
  }).filter(Boolean);
  const payload={nome,codigo,unidades};
  if(id){
    const i=data.clients.findIndex(x=>x.id===id);
    if(i>=0) data.clients[i]={...data.clients[i],...payload,updatedAt:new Date().toISOString()};
  } else {
    data.clients.unshift(createClient(payload));
  }
  save();
  closeModal();
  renderSidebar();
  if(selectedId===id) renderClientDetail();
  showToast(id?'Cliente atualizado':'Cliente criado');

function renameManagedTag(oldName){
  const newName=prompt('Novo nome da tag:', oldName);
  if(!newName || !newName.trim() || newName.trim()===oldName) return;
  const clean=newName.trim().toLowerCase();
  (data.scripts||[]).forEach(s=>{ if(s.tags) s.tags=s.tags.map(t=>t===oldName?clean:t); });
  ensureScriptTagsManaged();
  data.scriptTagsManaged=data.scriptTagsManaged.map(t=>t===oldName?clean:t);
  if(!data.scriptTagsManaged.includes(clean)) data.scriptTagsManaged.push(clean);
  save();
  openTagManager();
  showToast('Tag renomeada');
}
function deleteManagedTag(name){
  if(!confirm('Remover a tag "'+name+'" de todos os scripts?')) return;
  (data.scripts||[]).forEach(s=>{ if(s.tags) s.tags=s.tags.filter(t=>t!==name); });
  ensureScriptTagsManaged();
  data.scriptTagsManaged=data.scriptTagsManaged.filter(t=>t!==name);
  save();
  openTagManager();
  showToast('Tag removida');
}

function copyImageLink(url){
  showToast('Copiando imagem...');
  const doCopy = (blob) => {
    if(!navigator.clipboard || !window.ClipboardItem){
      showToast('Seu navegador não permite copiar imagem. Use botão direito → Copiar imagem');
      return;
    }
    const item = new ClipboardItem({ [blob.type || 'image/png']: blob });
    navigator.clipboard.write([item])
      .then(() => showToast('Imagem copiada! Cole com Ctrl+V'))
      .catch(err => {
        console.warn(err);
        showToast('Não foi possível copiar. Tente botão direito na imagem → Copiar imagem');
      });
  };

  if(url.startsWith('data:')){
    fetch(url).then(r => r.blob()).then(doCopy).catch(() => showToast('Erro ao processar imagem'));
  } else {
    fetch(url).then(r => r.blob()).then(doCopy).catch(() => showToast('Erro ao baixar imagem'));
  }
}

function handleFiles(files){
