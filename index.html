  const s=(data.scripts||[]).find(x=>x.id===id);
  if(!s) return;
  navigator.clipboard.writeText(s.texto).then(()=>{
    showToast('Script copiado!');
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=s.texto;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Script copiado!');
  });
}
function moveScript(id, dir){
  const idx = data.scripts.findIndex(s=>s.id===id);
  if(idx<0) return;
  const newIdx = idx + dir;
  if(newIdx<0 || newIdx>=data.scripts.length) return;
  const [item] = data.scripts.splice(idx,1);
  data.scripts.splice(newIdx,0,item);
  save();
  renderScriptsHome();
  renderSidebar();
}
function deleteScript(id){
  if(!confirm('Excluir este script?')) return;
  data.scripts=(data.scripts||[]).filter(x=>x.id!==id);
  save();
  renderScriptsHome();
  renderSidebar();
  showToast('Script excluído');
}

              <button class="btn btn-sm btn-outline" onclick="openTrainSession('${s.id}','${s.kind}')">Abrir</button>
              <button class="btn btn-sm btn-outline" style="color:var(--danger)" onclick="cancelTrainSession('${s.id}','${s.kind}')">Cancelar</button>
            </div>
          </div>
          <div class="list-prog" style="margin-top:8px"><span style="width:${p.percent}%"></span></div>
        </div>`;
      }).join('')||'<div class="empty-msg">Nenhuma sessão ainda. Clique em + Nova sessão.</div>'}
    </div>`;
}
function selectTraining(id){const t=(data.trainings||[]).find(x=>x.id===id);if(!t)return;selectedId=id;selectedType='treino';showDetail();const steps=getTreinoSteps(t.tipo);const p=treinoProgress(t);let lastG='';const stepsHtml=steps.map(s=>{let h='';if(s.g!==lastG){h=`<div class="treino-group-title">${escapeHtml(s.g)}</div>`;lastG=s.g}return h+`<div class="check-item ${t.done&&t.done[s.id]?'done':''}"><input type="checkbox" ${t.done&&t.done[s.id]?'checked':''} onchange="toggleTreinoStep('${t.id}','${s.id}')"/><div class="check-text">${escapeHtml(s.t)}</div></div>`}).join('');document.getElementById('detailView').innerHTML=`<div class="main-header"><div class="main-header-info"><h2>⚡ ${escapeHtml(t.clientName)}</h2><div class="main-header-meta">Checklist rápido · ${escapeHtml(t.tipo||'')} · ${p.done}/${p.total} · <span id="treinoTimerDisplay">${formatTimer(getTrainingElapsed(t))}</span></div></div><div class="main-header-actions">
        <button class="btn btn-sm btn-outline" onclick="toggleTrainingTimer('${t.id}')">${t.timerRunning?'⏸':'▶'} Timer</button>
        <button class="btn btn-sm btn-outline" onclick="changeRapidoTipo('${t.id}')">Trocar tipo</button>
        <button class="btn btn-sm btn-outline" onclick="convertTrainSession('${t.id}','rapido','manual')">→ Manual</button>
        <button class="btn btn-sm btn-success" onclick="copyTrainingSummary('${t.id}')">📋</button>
        <button class="btn btn-sm btn-outline" style="color:var(--danger)" onclick="cancelTrainSession('${t.id}','rapido')">Cancelar</button>
      </div></div><div class="main-content"><div class="progress-wrap"><div class="progress-bar" style="width:${p.percent}%"></div></div>${stepsHtml}</div>`;renderSidebar()}
function toggleTreinoStep(treinoId,stepId){const t=data.trainings.find(x=>x.id===treinoId);if(!t.done)t.done={};t.done[stepId]=!t.done[stepId];t.updatedAt=new Date().toISOString();const prog=treinoProgress(t);if(t.done[stepId]&&prog.total&&prog.done===prog.total)addXP('training_done',t.clientName);save();preserveScroll(()=>selectTraining(treinoId))}
function formatTimer(sec){sec=Math.max(0,Math.floor(sec||0));const m=Math.floor(sec/60),s=sec%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function getTrainingElapsed(t){let sec=t.timerSeconds||0;if(t.timerRunning&&t.timerStartedAt)sec+=Math.floor((Date.now()-new Date(t.timerStartedAt).getTime())/1000);return sec}
function toggleTrainingTimer(id){const t=data.trainings.find(x=>x.id===id);if(t.timerRunning){t.timerSeconds=getTrainingElapsed(t);t.timerRunning=false;t.timerStartedAt=null}else{t.timerRunning=true;t.timerStartedAt=new Date().toISOString()}save();selectTraining(id)}
function copyTrainingSummary(id){const t=data.trainings.find(x=>x.id===id);const p=treinoProgress(t);navigator.clipboard.writeText(`Treino — ${t.clientName}\nTipo: ${t.tipo}\nProgresso: ${p.done}/${p.total}\nDuração: ${formatTimer(getTrainingElapsed(t))}`).then(()=>showToast('Copiado'))}
setInterval(()=>{if(selectedType==='treino'&&selectedId){const t=(data.trainings||[]).find(x=>x.id===selectedId);if(t&&t.timerRunning){const el=document.getElementById('treinoTimerDisplay');if(el)el.textContent=formatTimer(getTrainingElapsed(t))}}},1000);

function renderAgendaHome(){showDetail();const list=(data.agenda||[]).slice().sort((a,b)=>new Date(a.quando)-new Date(b.quando));document.getElementById('detailView').innerHTML=`<div class="main-header"><div class="main-header-info"><h2>Agenda</h2></div><div class="main-header-actions"><button class="btn btn-sm btn-success" onclick="openAgendaModal()">+</button></div></div><div class="main-content">${list.map(a=>`<div class="info-card wide" style="margin-bottom:6px"><div class="info-card-label">${fmt(a.quando)}</div><div class="info-card-value">${escapeHtml(a.titulo||'')}</div></div>`).join('')||'<div class="empty-msg">Vazia</div>'}</div>`}
function openAgendaModal(){document.getElementById('modal').style.display='flex';document.getElementById('modal').innerHTML=`<div class="modal-box"><h3>Agendar</h3><div class="form-group"><label>Título</label><input id="m_at"/></div><div class="form-group"><label>Quando</label><input id="m_aw" type="datetime-local"/></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn btn-outline" onclick="closeModal()">Cancelar</button><button class="btn btn-success" onclick="const t=document.getElementById('m_at').value.trim();const w=document.getElementById('m_aw').value;if(!t||!w)return;if(!data.agenda)data.agenda=[];data.agenda.push({id:uid(),titulo:t,quando:new Date(w).toISOString()});save();closeModal();renderAgendaHome();renderSidebar()">Salvar</button></div></div>`}


function manualProgress(s){
  let total=0, done=0;
  MANUAL_SECTIONS.forEach(sec=>sec.items.forEach(it=>{ total++; if(s.done&&s.done[it.id]) done++; }));
  return {done,total,percent:total?Math.round(done/total*100):0};
}
function startNewManual(){
  const opts=(data.clients||[]).filter(c=>!c.archived).map(c=>`<option value="${c.id}">${escapeHtml(c.nome)}</option>`).join('');
  document.getElementById('modal').style.display='flex';
  document.getElementById('modal').innerHTML=`<div class="modal-box"><h3>Sessão — Manual oficial</h3>
    <div class="form-group"><label>Cliente</label><select id="m_man_client"><option value="">—</option>${opts}</select></div>
    <div class="form-group"><label>Nome avulso</label><input id="m_man_name" placeholder="Se não vincular cliente" /></div>
    <p style="font-size:.78rem;color:var(--text-muted);margin:8px 0">Roteiro do Manual de Treinamento Operacional BeeFood (9 seções). O treino antigo continua em Treino.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-success" onclick="createManualSession()">Iniciar</button>
    </div></div>`;
}
function createManualSession(){
  const clientId=document.getElementById('m_man_client').value;
  let name=(document.getElementById('m_man_name').value||'').trim();
  if(clientId){ const cl=data.clients.find(c=>c.id===clientId); if(cl) name=cl.nome; }
  if(!name) name='Sessão manual';
  if(!data.manualSessions) data.manualSessions=[];
  const s={id:uid(),clientId,clientName:name,done:{},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  data.manualSessions.unshift(s); save(); closeModal(); selectManual(s.id);
}
function selectManual(id){
  const s=(data.manualSessions||[]).find(x=>x.id===id); if(!s) return;
  selectedId=id; selectedType='manual'; showDetail();
  const p=manualProgress(s);
  const sections=MANUAL_SECTIONS.map(sec=>{
    const doneSec=sec.items.filter(it=>s.done&&s.done[it.id]).length;
    const items=sec.items.map(it=>`<div class="check-item ${s.done&&s.done[it.id]?'done':''}">
      <input type="checkbox" ${s.done&&s.done[it.id]?'checked':''} onchange="toggleManualStep('${s.id}','${it.id}')" />
      <div class="check-text">${escapeHtml(it.t)}</div></div>`).join('');
    return `<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>${escapeHtml(sec.titulo)} (${doneSec}/${sec.items.length})</span><span class="chevron">▶</span></div>
      <div class="section-body open">${items}</div></div>`;
  }).join('');
  document.getElementById('detailView').innerHTML=`
    <div class="main-header"><div class="main-header-info">
      <h2>📘 Manual oficial — ${escapeHtml(s.clientName)}</h2>
      <div class="main-header-meta">Roteiro Operacional BeeFood · ${p.done}/${p.total} (${p.percent}%)</div></div>
      <div class="main-header-actions">
        <button class="btn btn-sm btn-outline" onclick="resetManualSession('${s.id}')">↺ Limpar</button>
        <button class="btn btn-sm btn-outline" onclick="convertTrainSession('${s.id}','manual','rapido')">→ Rápido</button>
        <button class="btn btn-sm btn-success" onclick="copyManualSummary('${s.id}')">📋 Resumo</button>
        <button class="btn btn-sm btn-outline" style="color:var(--danger)" onclick="cancelTrainSession('${s.id}','manual')">Cancelar</button>
      </div></div>
    <div class="main-content">
      <div class="progress-wrap"><div class="progress-bar" style="width:${p.percent}%"></div></div>
      <div class="info-card wide" style="margin-bottom:10px;border-left:4px solid var(--accent)">
        <div class="info-card-label">Base</div>
        <div class="info-card-value" style="font-size:.82rem">Manual e Roteiro de Treinamento Operacional BeeFood — guia cronológico. O menu <strong>Treino</strong> antigo permanece separado.</div>
      </div>
      ${sections}
      <div class="info-card wide" style="margin-top:8px">
        <div class="info-card-label">Horários de suporte (Brasília)</div>
        <div class="info-card-value" style="font-size:.82rem">Seg–Sex 9h–22h · Sáb/feriado 10h–22h · Dom 11h–14h e 17h–21h</div>
      </div>
    </div>`;
  renderSidebar();
}
function toggleManualStep(sid, stepId){
  const s=data.manualSessions.find(x=>x.id===sid); if(!s.done) s.done={};
  s.done[stepId]=!s.done[stepId]; s.updatedAt=new Date().toISOString(); save(); preserveScroll(()=>selectManual(sid));
}
function resetManualSession(sid){
  if(!confirm('Zerar todas as marcas desta sessão?')) return;
  const s=data.manualSessions.find(x=>x.id===sid); s.done={}; s.updatedAt=new Date().toISOString(); save(); selectManual(sid); showToast('Checklist limpo');
}
function copyManualSummary(sid){
  const s=data.manualSessions.find(x=>x.id===sid); const p=manualProgress(s);
  const lines=['Manual oficial BeeFood — '+s.clientName, 'Progresso: '+p.done+'/'+p.total+' ('+p.percent+'%)',''];
  MANUAL_SECTIONS.forEach(sec=>{
    const pending=sec.items.filter(it=>!(s.done&&s.done[it.id]));
    if(pending.length){ lines.push(sec.titulo); pending.forEach(it=>lines.push('  ○ '+it.t)); lines.push(''); }
  });
  if(lines.length<=3) lines.push('Todas as etapas marcadas.');
  navigator.clipboard.writeText(lines.join('\n')).then(()=>showToast('Resumo copiado'));
}
function renderManualHome(){
  showDetail();
  const list=data.manualSessions||[];
  document.getElementById('detailView').innerHTML=`
    <div class="main-header"><div class="main-header-info"><h2>📘 Manual operacional</h2>
      <div class="main-header-meta">Roteiro oficial BeeFood (9 seções) · separado do menu Treino</div></div>
      <div class="main-header-actions"><button class="btn btn-sm btn-success" onclick="startNewManual()">+ Sessão</button></div></div>
    <div class="main-content">
      <div class="info-card wide" style="margin-bottom:10px;border-left:4px solid var(--accent)">
        <div class="info-card-value" style="font-size:.85rem">Checklist baseado no <strong>Manual e Roteiro de Treinamento Operacional BeeFood</strong>: diagnóstico, dashboard/caixa, BeeBot, delivery, mesas, PDV, fechamento, cardápio e protocolo final.</div>
      </div>
      ${list.map(s=>{ const p=manualProgress(s); return `<div class="info-card wide" style="margin-bottom:8px;cursor:pointer" onclick="selectManual('${s.id}')">
        <div class="info-card-label">${escapeHtml(s.clientName)}</div>
        <div class="info-card-value">${p.done}/${p.total} (${p.percent}%) · ${fmt(s.updatedAt||s.createdAt)}</div></div>`; }).join('')||'<div class="empty-msg">Nenhuma sessão — clique em + Sessão</div>'}
    </div>`;
}

function renderConfig(){showDetail();document.getElementById('detailView').innerHTML=`<div class="main-header"><div class="main-header-info"><h2>Config</h2></div></div><div class="main-content">
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Backup</span><span class="chevron">▶</span></div><div class="section-body open"><p style="font-size:.8rem;color:var(--text-muted);margin-bottom:8px">Último backup local: ${fmt(data.lastBackupAt)}. Os dados da equipe já sincronizam automaticamente na nuvem. O exportar continua disponível como cópia de segurança no seu computador. A cada 7 dias o sistema lembra do backup local.</p><button class="btn btn-sm btn-success" onclick="exportData()">Exportar</button> <label class="btn btn-sm btn-outline" style="display:inline-flex;cursor:pointer">Importar<input type="file" accept="application/json" style="display:none" onchange="importData(event)"/></label> <button class="btn btn-sm btn-outline" onclick="ensureDefaultScripts();ensureWikiSeed();showToast('Mesclado')">Mesclar scripts/wiki</button></div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Bitrix</span><span class="chevron">▶</span></div><div class="section-body open">${(data.bitrixTemplates||[]).map((t,i)=>`<div style="margin-bottom:8px;padding:8px;border:1px solid var(--border);border-radius:8px"><input value="${escapeHtml(t.titulo)}" onchange="data.bitrixTemplates[${i}].titulo=this.value;save()" style="width:100%;margin-bottom:4px;background:#0f172a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px"/><textarea onchange="data.bitrixTemplates[${i}].texto=this.value;save()" style="width:100%;min-height:50px;background:#0f172a;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:6px">${escapeHtml(t.texto)}</textarea></div>`).join('')}</div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Notificações</span><span class="chevron">▶</span></div><div class="section-body open"><button class="btn btn-sm btn-outline" onclick="Notification.requestPermission().then(p=>showToast('Permissão: '+p))">Permitir</button></div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Aparência e som</span><span class="chevron">▶</span></div><div class="section-body open">
<button class="btn btn-sm btn-outline" onclick="toggleTheme()">🌓 Tema claro/escuro</button>
<button class="btn btn-sm btn-outline" onclick="toggleSound()">🔔 Som conquistas</button>
<button class="btn btn-sm btn-outline" onclick="toggleFocusMode()">🎯 Modo foco</button>
</div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Mensagem de finalização</span><span class="chevron">▶</span></div><div class="section-body open" style="font-size:.82rem">
<label style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer">
  <input type="checkbox" ${((data.settings||{}).finalIncluirFiscal)?'checked':''} onchange="data.settings.finalIncluirFiscal=this.checked;save();showToast(this.checked?'Fiscal na finalização: sim':'Fiscal na finalização: não')" />
  Incluir fiscal / TEF no texto copiado
</label>
<label style="display:flex;align-items:center;gap:8px;cursor:pointer">
  <input type="checkbox" ${((data.settings||{}).finalIncluirPosVenda)?'checked':''} onchange="data.settings.finalIncluirPosVenda=this.checked;save();showToast(this.checked?'Pós-venda na finalização: sim':'Pós-venda na finalização: não')" />
  Incluir menção ao pós-venda D+7 / D+30
</label>
<p style="margin-top:8px;color:var(--text-muted);font-size:.75rem">Por padrão o resumo fica só com cliente, tipo e conclusão — sem fiscal nem pós-venda.</p>
</div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Atalhos de teclado</span><span class="chevron">▶</span></div><div class="section-body open" style="font-size:.82rem;color:var(--text-muted);line-height:1.6">
<code>/</code> busca · <code>N</code> novo · <code>F</code> modo foco · <code>Esc</code> fechar<br>

<code>5</code> Scripts · <code>6</code> Wiki · <code>7</code> Carreira · <code>8</code> Config
</div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Conta e sincronização</span><span class="chevron">▶</span></div><div class="section-body open" style="font-size:.82rem">
<p style="color:var(--text-muted);margin-bottom:8px">Conectado como <strong>${escapeHtml((currentAnalyst&&currentAnalyst.nome)||'—')}</strong>${currentAnalyst&&currentAnalyst.isAdmin?' (admin)':''}. Última sincronização: ${fmt(data.lastTeamSync)}.</p>
<button class="btn btn-sm btn-outline" onclick="syncToTeam()">Sincronizar agora</button>
<button class="btn btn-sm btn-outline" onclick="logoutAnalyst()">Sair</button>
</div></div>
<div class="section-box"><div class="section-head open" onclick="toggleSection(this)"><span>Histórico de alterações</span><span class="chevron">▶</span></div><div class="section-body open" id="auditLogList">${typeof renderAuditList==='function'?renderAuditList():''}</div></div>
</div>`}

function checkAlerts(){const now=Date.now();(data.clients||[]).forEach(c=>{(c.alertas||[]).forEach(a=>{if(a.done||a._notified)return;const t=new Date(a.quando).getTime();if(t<=now&&t>now-120000){a._notified=true;try{if(Notification.permission==='granted')new Notification('Onboarding: '+c.nome,{body:a.texto,requireInteraction:true})}catch(e){}showToast('⏰ '+c.nome+': '+a.texto)}})});save()}
setInterval(checkAlerts,30000);

document.addEventListener('keydown',function(ev){
  const tag=(ev.target&&ev.target.tagName||'').toLowerCase();
  if(tag==='input'||tag==='textarea'||tag==='select'||ev.target.isContentEditable) {
    if(ev.key==='Escape'){ ev.target.blur(); return; }
    return;
  }
  if(ev.key==='/' ){ ev.preventDefault(); const s=document.getElementById('searchInput'); if(s){s.focus();s.select()} return; }
  if(ev.key==='n'||ev.key==='N'){ if(!ev.ctrlKey&&!ev.metaKey){ ev.preventDefault(); onNewMain(); } return; }
  if(ev.key==='f'||ev.key==='F'){ if(!ev.ctrlKey){ toggleFocusMode(); } return; }
  if(ev.key==='Escape'){ if(document.body.classList.contains('focus-mode')) toggleFocusMode(); closeModal(); return; }
  const map={'1':'dashboard','2':'clientes','3':'agenda','4':'treino','5':'scripts','6':'casos','7':'carreira','8':'config'};
  if(map[ev.key]){ switchTab(map[ev.key]); }
});

    if(user) enterApp(user);
    else {
      fbReady=false;
      currentAnalyst=null;
      showLogin();

  });
}else{
  const loginHint=document.querySelector('#loginOverlay div div:last-child');
  showToast('Não foi possível carregar a nuvem. Recarregue a página.');
}
switchTab('dashboard');
if(needsWeeklyBackup())setTimeout(()=>showToast('Lembrete: faça o backup semanal'),1500);
